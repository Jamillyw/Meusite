   ROTEIROS
============================================================ */
function renderScriptsSection(root){
  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px';
  head.innerHTML = `
    <div style="font-size:13px;color:var(--muted)">${state.scripts.length} roteiro(s)</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="ai-improve" disabled title="Disponível em futura integração com IA">${ICONS.sparkles} Melhorar com IA</button>
      <button class="btn btn-primary" id="new-script">${ICONS.plus} Novo roteiro</button>
    </div>
  `;
  wrap.appendChild(head);
  head.querySelector('#ai-improve').onclick = () => toast('Função disponível em uma futura integração com IA.', 'warn');
  head.querySelector('#new-script').onclick = () => openScriptCreateModal();

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  grid.id = 'scripts-grid';
  wrap.appendChild(grid);
  root.appendChild(wrap);

  renderScriptsGrid();

  // Se houver um script aberto, mostra editor
  if (openScriptId){
    const s = state.scripts.find(x => x.id === openScriptId);
    if (s){
      root.innerHTML = '';
      root.appendChild(head);
      root.appendChild(renderScriptEditor(s));
    } else { openScriptId = null; }
  } else {
    // Mostra lista
    const back = document.createElement('div');
    // (o grid já está na tela)
  }
}

let openScriptId = null;

function renderScriptsGrid(){
  const grid = $('#scripts-grid');
  if (!grid) return;
  grid.innerHTML = '';
  if (state.scripts.length === 0){
    const empty = document.createElement('div');
    empty.style.gridColumn = '1/-1';
    empty.appendChild(emptyState({
      title:'Nenhum roteiro ainda',
      message:'Crie um roteiro para começar a estruturar seus vídeos.',
      actionLabel:'+ Novo roteiro',
      onAction: () => openScriptCreateModal()
    }));
    grid.appendChild(empty);
    return;
  }
  state.scripts.forEach(s => {
    const video = state.videos.find(v => v.id === s.videoId);
    const words = wordCount(s.content);
    const card = document.createElement('div');
    card.className = 'idea-card';
    card.innerHTML = `
      <div class="idea-card-title">${esc(s.title)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${statusBadgeScript(s.status)}
        <span class="badge">${words} palavras</span>
        <span class="badge">${estimateDuration(words)}</span>
      </div>
      ${video ? `<div class="idea-card-meta">Vídeo: ${esc(video.workTitle)}</div>` : ''}
      <div class="idea-card-desc">${esc((s.content||'').slice(0,120))}</div>
      <div class="idea-card-foot">
        <div class="idea-card-meta">${timeAgo(s.updatedAt)}</div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-sm btn-ghost" data-act="open">${ICONS.edit}</button>
          <button class="btn btn-sm btn-ghost" data-act="del">${ICONS.trash}</button>
        </div>
      </div>
    `;
    card.onclick = (e) => {
      if (e.target.closest('button')) return;
      openScriptEditor(s.id);
    };
    card.querySelector('[data-act="open"]').onclick = (e) => { e.stopPropagation(); openScriptEditor(s.id); };
    card.querySelector('[data-act="del"]').onclick = (e) => {
      e.stopPropagation();
      confirmDialog({
        title:'Excluir roteiro',
        message:`Excluir "${s.title}"?`,
        confirmLabel:'Excluir',
        onConfirm: () => {
          state.scripts = state.scripts.filter(x => x.id !== s.id);
          state.videos.forEach(v => { if (v.scriptId === s.id) v.scriptId = ''; });
          saveState();
          refresh();
          toast('Roteiro excluído', 'success');
        }
      });
    };
    grid.appendChild(card);
  });
}

function openScriptCreateModal(){
  const body = document.createElement('div');
  body.className = 'form-grid one';
  body.innerHTML = `
    <div class="form-field">
      <label>Título do roteiro *</label>
      <input class="input" name="title">
    </div>
    <div class="form-field">
      <label>Vídeo relacionado</label>
      <select class="input" name="videoId">
        <option value="">— Nenhum —</option>
        ${state.videos.map(v => `<option value="${esc(v.id)}">${esc(v.workTitle)}</option>`).join('')}
      </select>
    </div>
    <div class="form-field">
      <label>Status</label>
      <select class="input" name="status">
        <option>Rascunho</option>
        <option>Em desenvolvimento</option>
        <option>Pronto</option>
        <option>Gravado</option>
      </select>
    </div>
  `;
  openModal({
    title:'Novo roteiro',
    body,
    actions:[
      { label:'Cancelar', className:'btn-ghost', onClick:(c)=>c() },
      { label:'Criar', className:'btn-primary', onClick:(close)=>{
        const fd = new FormData(body);
        const title = (fd.get('title')||'').trim();
        if (!title){ toast('Informe o título', 'error'); return; }
        const s = {
          id: uid('scr'),
          title,
          videoId: fd.get('videoId') || '',
          status: fd.get('status') || 'Rascunho',
          content:'',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          notes:'',
          blocks: []
        };
        state.scripts.push(s);
        if (s.videoId){
          const v = state.videos.find(x => x.id === s.videoId);
          if (v) v.scriptId = s.id;
        }
        saveState();
        close();
        openScriptEditor(s.id);
        toast('Roteiro criado', 'success');
      }}
    ]
  });
}

function openScriptEditor(id){
  const s = state.scripts.find(x => x.id === id);
  if (!s) return;
  openScriptId = id;
  refresh();
  document.body.classList.add('focus-mode');
}

function closeScriptEditor(){
  openScriptId = null;
  document.body.classList.remove('focus-mode');
  refresh();
}

function renderScriptEditor(s){
  const wrap = document.createElement('div');
  wrap.className = 'script-editor';

  const video = state.videos.find(v => v.id === s.videoId);

  // Cabeçalho
  const head = document.createElement('div');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px';
  head.innerHTML = `
    <button class="btn btn-ghost" id="back-scripts">← Voltar aos roteiros</button>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="focus-toggle" title="Modo foco">Modo foco</button>
      <button class="btn btn-ghost" id="ai-script" disabled title="Disponível em futura integração com IA">${ICONS.sparkles} Melhorar com IA</button>
      <button class="btn btn-primary" id="save-script">Salvar</button>
    </div>
  `;
  wrap.appendChild(head);

  // Título + meta
  const titleWrap = document.createElement('div');
  titleWrap.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  titleWrap.innerHTML = `
    <input class="input" id="script-title" value="${esc(s.title)}" style="font-size:18px;font-weight:700;height:44px">
    <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr">
      <div class="form-field">
        <label>Vídeo</label>
        <select class="input" id="script-video">
          <option value="">— Nenhum —</option>
          ${state.videos.map(v => `<option value="${esc(v.id)}" ${s.videoId===v.id?'selected':''}>${esc(v.workTitle)}</option>`).join('')}
        </select>
      </div>
      <div class="form-field">
        <label>Status</label>
        <select class="input" id="script-status">
          ${['Rascunho','Em desenvolvimento','Pronto','Gravado'].map(x => `<option ${s.status===x?'selected':''}>${x}</option>`).join('')}
        </select>
      </div>
      <div class="form-field">
        <label>Última edição</label>
        <input class="input" readonly value="${timeAgo(s.updatedAt)}">
      </div>
    </div>
  `;
  wrap.appendChild(titleWrap);

  // meta stat
  const meta = document.createElement('div');
  meta.className = 'script-meta';
  const updateMeta = () => {
    const words = wordCount(s.content);
    meta.innerHTML = `
      <div class="script-meta-item">📝 <strong>${words}</strong> palavras</div>
      <div class="script-meta-item">🔤 <strong>${(s.content||'').length}</strong> caracteres</div>
      <div class="script-meta-item">⏱ <strong>${estimateDuration(words)}</strong> de fala</div>
    `;
  };
  wrap.appendChild(meta);
  updateMeta();

  // textarea
  const ta = document.createElement('textarea');
  ta.id = 'script-content';
  ta.placeholder = 'Escreva seu roteiro aqui...';
  ta.value = s.content || '';
  wrap.appendChild(ta);
  ta.addEventListener('input', () => {
    s.content = ta.value;
    updateMeta();
  });

  // blocos
  const blockSection = document.createElement('div');
  blockSection.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-weight:700;font-size:14px">Blocos estruturados</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-ghost" id="add-block-preset">+ Bloco padrão</button>
        <button class="btn btn-sm btn-primary" id="add-block">${ICONS.plus} Bloco vazio</button>
      </div>
    </div>
  `;
  const blocksList = document.createElement('div');
  blocksList.className = 'blocks-list';
  blocksList.id = 'blocks-list';
  blockSection.appendChild(blocksList);

  const renderBlocks = () => {
    blocksList.innerHTML = '';
    (s.blocks || []).forEach((b, idx) => {
      const item = document.createElement('div');
      item.className = 'block-item';
      item.draggable = true;
      item.dataset.idx = idx;
      item.innerHTML = `
        <div class="block-head">
          <span class="grip">⋮⋮</span>
          <span class="block-name">${esc(b.name)}</span>
          <span style="flex:1"></span>
          <button class="btn btn-sm btn-ghost" data-act="rename">Renomear</button>
          <button class="btn btn-sm btn-ghost" data-act="del">${ICONS.trash}</button>
        </div>
        <textarea class="block-content" placeholder="Conteúdo do bloco...">${esc(b.content || '')}</textarea>
      `;
      const contentEl = item.querySelector('.block-content');
      contentEl.addEventListener('input', () => { b.content = contentEl.value; });
      item.querySelector('[data-act="del"]').onclick = () => {
        s.blocks.splice(idx,1);
        renderBlocks();
      };
      item.querySelector('[data-act="rename"]').onclick = () => {
        const nn = prompt('Nome do bloco:', b.name);
        if (nn != null && nn.trim()){
          b.name = nn.trim();
          renderBlocks();
        }
      };
      // drag reorder
      item.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', idx);
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => item.classList.remove('dragging'));
      item.addEventListener('dragover', e => e.preventDefault());
      item.addEventListener('drop', e => {
        e.preventDefault();
        const from = +e.dataTransfer.getData('text/plain');
        if (from === idx) return;
        const moved = s.blocks.splice(from, 1)[0];
        s.blocks.splice(idx, 0, moved);
        renderBlocks();
      });
      blocksList.appendChild(item);
    });
  };
  renderBlocks();

  blockSection.querySelector('#add-block').onclick = () => {
    s.blocks = s.blocks || [];
    s.blocks.push({ id: uid('b'), name:'Novo bloco', content:'' });
    renderBlocks();
  };
  blockSection.querySelector('#add-block-preset').onclick = () => {
    s.blocks = s.blocks || [];
    const presets = ['HOOK','INTRODUÇÃO','CONTEXTO','DESENVOLVIMENTO','EXEMPLO','CONTRAPONTO','CONCLUSÃO','CTA'];
    const used = new Set(s.blocks.map(b => b.name));
    const next = presets.find(p => !used.has(p)) || 'Bloco';
    s.blocks.push({ id: uid('b'), name: next, content:'' });
    renderBlocks();
  };

  wrap.appendChild(blockSection);

  // Notas
  const notesSection = document.createElement('div');
  notesSection.style.marginTop = '16px';
  notesSection.innerHTML = `
    <div style="font-weight:700;font-size:14px;margin-bottom:8px">Observações</div>
    <textarea class="input" id="script-notes" placeholder="Anotações sobre este roteiro...">${esc(s.notes || '')}</textarea>
  `;
  wrap.appendChild(notesSection);

  // Autosave
  const saveNow = (silent=false) => {
    s.title = $('#script-title', wrap).value.trim() || s.title;
    s.videoId = $('#script-video', wrap).value;
    s.status = $('#script-status', wrap).value;
    s.notes = $('#script-notes', wrap).value;
    s.content = ta.value;
    s.updatedAt = new Date().toISOString();
    // atualiza link do vídeo
    state.videos.forEach(v => { if (v.scriptId === s.id && v.id !== s.videoId) v.scriptId = ''; });
    if (s.videoId){
      const v = state.videos.find(x => x.id === s.videoId);
      if (v) v.scriptId = s.id;
    }
    saveState();
    if (!silent) toast('Roteiro salvo', 'success');
  };

  const autoSave = debounce(() => saveNow(true), 1200);

  ta.addEventListener('input', autoSave);
  $('#script-title', wrap).addEventListener('input', autoSave);
  $('#script-status', wrap).addEventListener('change', () => saveNow(true));
  $('#script-video', wrap).addEventListener('change', () => saveNow(true));
  $('#script-notes', wrap).addEventListener('input', autoSave);

  wrap.querySelector('#save-script').onclick = () => saveNow();
  wrap.querySelector('#back-scripts').onclick = () => { saveNow(true); closeScriptEditor(); };
  wrap.querySelector('#ai-script').onclick = () => toast('Função disponível em uma futura integração com IA.', 'warn');
  wrap.querySelector('#focus-toggle').onclick = () => {
    document.body.classList.toggle('focus-mode');
  };

  return wrap;
}

/* ============================================================
   CALENDÁRIO
============================================================ */
let calendarDate = new Date();

function renderCalendarSection(root){
  const wrap = document.createElement('div');
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();
  const monthName = calendarDate.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});

  const head = document.createElement('div');
  head.className = 'cal-header';
  head.innerHTML = `
    <button class="btn" id="cal-prev">←</button>
    <div class="cal-title">${esc(monthName.charAt(0).toUpperCase() + monthName.slice(1))}</div>
    <button class="btn" id="cal-next">→</button>
    <button class="btn btn-ghost" id="cal-today" style="margin-left:auto">Hoje</button>
  `;
  wrap.appendChild(head);
  head.querySelector('#cal-prev').onclick = () => { calendarDate.setMonth(calendarDate.getMonth() - 1); refresh(); };
  head.querySelector('#cal-next').onclick = () => { calendarDate.setMonth(calendarDate.getMonth() + 1); refresh(); };
  head.querySelector('#cal-today').onclick = () => { calendarDate = new Date(); refresh(); };

  const grid = document.createElement('div');
  grid.className = 'cal-grid';

  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();

  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  // dias do mês anterior
  for (let i = startWeekday - 1; i >= 0; i--){
    const day = prevMonthDays - i;
    const cell = document.createElement('div');
    cell.className = 'cal-cell other';
    cell.innerHTML = `<div class="cal-date">${day}</div>`;
    grid.appendChild(cell);
  }

  // dias do mês
  for (let day = 1; day <= daysInMonth; day++){
    const dt = new Date(year, month, day);
    const dtStr = dt.toISOString().slice(0,10);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    if (dtStr === todayStr) cell.classList.add('today');
    cell.innerHTML = `<div class="cal-date">${day}</div>`;

    state.videos.filter(v => v.publishDate === dtStr).forEach(v => {
      const ev = document.createElement('div');
      ev.className = 'cal-event';
      if (v.status === 'Publicado') ev.classList.add('publicado');
      else if (isOverdue(v.publishDate)) ev.classList.add('atrasado');
      else if (v.status === 'Agendado') ev.classList.add('agendado');
      ev.textContent = v.workTitle;
      ev.title = `${v.workTitle} · ${v.status}`;
      ev.onclick = () => openVideoDrawer(v.id);
      cell.appendChild(ev);
    });
    grid.appendChild(cell);
  }

  // dias do próximo mês
  const totalCells = startWeekday + daysInMonth;
  const rest = (7 - (totalCells % 7)) % 7;
  for (let day = 1; day <= rest; day++){
    const cell = document.createElement('div');
    cell.className = 'cal-cell other';
    cell.innerHTML = `<div class="cal-date">${day}</div>`;
    grid.appendChild(cell);
  }

  wrap.appendChild(grid);
  root.appendChild(wrap);
}

/* ============================================================
   BIBLIOTECA
============================================================ */
function renderLibrarySection(root){
  const wrap = document.createElement('div');

  const head = document.createElement('div');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px';
  head.innerHTML = `
    <div style="font-size:13px;color:var(--muted)">${state.library.length} referência(s)</div>
    <button class="btn btn-primary" id="new-lib">${ICONS.plus} Nova referência</button>
  `;
  wrap.appendChild(head);
  head.querySelector('#new-lib').onclick = () => openLibraryModal();

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  wrap.appendChild(grid);
  root.appendChild(wrap);

  if (state.library.length === 0){
    const empty = document.createElement('div');
    empty.style.gridColumn = '1/-1';
    empty.appendChild(emptyState({
      title:'Biblioteca vazia',
      message:'Armazene referências, artigos e links úteis para seus conteúdos.',
      actionLabel:'+ Nova referência',
      onAction: () => openLibraryModal()
    }));
    grid.appendChild(empty);
    return;
  }

  state.library.forEach(item => {
    const card = document.createElement('div');
    card.className = 'idea-card';
    card.innerHTML = `
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div class="idea-card-title" style="flex:1">${esc(item.name)}</div>
        ${item.type ? `<span class="badge">${esc(item.type)}</span>` : ''}
      </div>
      ${item.notes ? `<div class="idea-card-desc">${esc(item.notes)}</div>` : ''}
      <div class="idea-card-meta" style="word-break:break-all;font-size:12px">
        ${item.url ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.url)}</a>` : 'Sem URL'}
      </div>
      ${item.tags ? `<div style="display:flex;gap:4px;flex-wrap:wrap">${tagList(item.tags).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="idea-card-foot">
        <div class="idea-card-meta">${item.category ? esc(item.category) : ''}</div>
        <div style="display:flex;gap:4px">
          ${item.url ? `<button class="btn btn-sm btn-ghost" data-act="copy" title="Copiar URL">${ICONS.copy}</button>` : ''}
          ${item.url ? `<a class="btn btn-sm btn-ghost" href="${esc(item.url)}" target="_blank" rel="noopener" title="Abrir">${ICONS.external}</a>` : ''}
          <button class="btn btn-sm btn-ghost" data-act="edit">${ICONS.edit}</button>
          <button class="btn btn-sm btn-ghost" data-act="del">${ICONS.trash}</button>
        </div>
      </div>
    `;
    card.onclick = (e) => {
      if (e.target.closest('button, a')) return;
      openLibraryModal(item.id);
    };
    const copyBtn = card.querySelector('[data-act="copy"]');
    if (copyBtn) copyBtn.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(item.url).then(() => toast('URL copiada', 'success'));
    };
    card.querySelector('[data-act="edit"]').onclick = (e) => { e.stopPropagation(); openLibraryModal(item.id); };
    card.querySelector('[data-act="del"]').onclick = (e) => {
      e.stopPropagation();
      confirmDialog({
        title:'Excluir referência',
        message:`Excluir "${item.name}"?`,
        confirmLabel:'Excluir',
        onConfirm: () => {
          state.library = state.library.filter(x => x.id !== item.id);
          saveState();
          refresh();
          toast('Referência excluída', 'success');
        }
      });
    };
    grid.appendChild(card);
  });
}

function openLibraryModal(id){
  const isEdit = !!id;
  const item = isEdit ? state.library.find(x => x.id === id) : null;
  const body = document.createElement('div');
  body.className = 'form-grid';
  body.innerHTML = `
    <div class="form-field full">
      <label>Nome *</label>
      <input class="input" name="name" value="${esc(item?.name || '')}">
    </div>
    <div class="form-field full">
      <label>URL</label>
      <input class="input" name="url" value="${esc(item?.url || '')}" placeholder="https://...">
    </div>
    <div class="form-field">
      <label>Tipo</label>
      <select class="input" name="type">
        ${['Vídeo do YouTube','Artigo','Site','Pesquisa','Imagem','Documento','Outra referência'].map(t => `<option ${item?.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-field">
      <label>Categoria</label>
      <input class="input" name="category" value="${esc(item?.category || '')}">
    </div>
    <div class="form-field full">
      <label>Tags</label>
      <input class="input" name="tags" value="${esc(item?.tags || '')}" placeholder="separadas por vírgula">
    </div>
    <div class="form-field full">
      <label>Observações</label>
      <textarea class="input" name="notes">${esc(item?.notes || '')}</textarea>
    </div>
    <div class="form-field full">
      <label>Conteúdo relacionado</label>
      <select class="input" name="relatedTo">
        <option value="">— Nenhum —</option>
        ${state.videos.map(v => `<option value="${esc(v.id)}" ${item?.relatedTo===v.id?'selected':''}>${esc(v.workTitle)}</option>`).join('')}
      </select>
    </div>
  `;
  openModal({
    title: isEdit ? 'Editar referência' : 'Nova referência',
    body,
    actions: [
      { label:'Cancelar', className:'btn-ghost', onClick:(c)=>c() },
      { label: isEdit ? 'Salvar' : 'Adicionar', className:'btn-primary', onClick:(close)=>{
        const fd = new FormData(body);
        const data = {
          name: (fd.get('name')||'').trim(),
          url: (fd.get('url')||'').trim(),
          type: fd.get('type') || '',
          category: (fd.get('category')||'').trim(),
          tags: (fd.get('tags')||'').trim(),
          notes: (fd.get('notes')||'').trim(),
          relatedTo: fd.get('relatedTo') || ''
        };
        if (!data.name){ toast('Informe o nome', 'error'); return; }
        if (isEdit) Object.assign(item, data);
        else state.library.push({ id: uid('lib'), ...data });
        saveState();
        refresh();
        toast(isEdit ? 'Referência atualizada' : 'Referência adicionada', 'success');
        close();
      }}
    ]
  });
}

/* ============================================================
   NOTAS
============================================================ */
function renderNotesSection(root){
  const wrap = document.createElement('div');
  const head = document.createElement('div');
  head.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px';
  head.innerHTML = `
    <div style="font-size:13px;color:var(--muted)">${state.notes.length} nota(s)</div>
    <button class="btn btn-primary" id="new-note">${ICONS.plus} Nova nota</button>
  `;
  wrap.appendChild(head);
  head.querySelector('#new-note').onclick = () => openNoteModal();

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  grid.id = 'notes-grid';
  wrap.appendChild(grid);
  root.appendChild(wrap);
  renderNotesList(grid, false);
}

function renderNotesList(container, compact){
  if (!container) return;
  container.innerHTML = '';
  if (state.notes.length === 0){
    if (!compact){
      const empty = document.createElement('div');
      empty.style.gridColumn = '1/-1';
      empty.appendChild(emptyState({
        title:'Sem notas',
        message:'Crie notas rápidas para capturar ideias soltas.',
        actionLabel:'+ Nova nota',
        onAction: () => openNoteModal()
      }));
      container.appendChild(empty);
    } else {
      container.innerHTML = '<div style="font-size:13px;color:var(--muted)">Nenhuma nota ainda.</div>';
    }
    return;
  }
  const wrap = compact ? container : container;
  state.notes
    .sort((a,b) => new Date(b.date) - new Date(a.date))
    .forEach(n => {
      const card = document.createElement('div');
      card.className = compact ? 'quick-item' : 'idea-card';
      card.innerHTML = `
        <div class="idea-card-title" style="font-size:${compact?'13px':'14px'}">${esc(n.title)}</div>
        <div class="idea-card-desc" style="font-size:${compact?'12px':'12.5px'}">${esc(n.text)}</div>
        <div class="idea-card-foot">
          <div class="idea-card-meta">${n.tag ? `<span class="tag">${esc(n.tag)}</span> · ` : ''}${fmtDateShort(n.date)}</div>
          ${!compact ? `<div style="display:flex;gap:4px">
            <button class="btn btn-sm btn-ghost" data-act="edit">${ICONS.edit}</button>
            <button class="btn btn-sm btn-ghost" data-act="del">${ICONS.trash}</button>
          </div>` : ''}
        </div>
      `;
      if (!compact){
        card.onclick = (e) => {
          if (e.target.closest('button')) return;
          openNoteModal(n.id);
        };
        card.querySelector('[data-act="edit"]').onclick = (e) => { e.stopPropagation(); openNoteModal(n.id); };
        card.querySelector('[data-act="del"]').onclick = (e) => {
          e.stopPropagation();
          confirmDialog({
            title:'Excluir nota',
            message:`Excluir "${n.title}"?`,
            confirmLabel:'Excluir',
            onConfirm: () => {
              state.notes = state.notes.filter(x => x.id !== n.id);
              saveState();
              refresh();
            }
          });
        };
      } else {
        card.style.cursor = 'pointer';
        card.onclick = () => openNoteModal(n.id);
      }
      wrap.appendChild(card);
    });
}

function openNoteModal(id){
  const isEdit = !!id;
  const n = isEdit ? state.notes.find(x => x.id === id) : null;
  const body = document.createElement('div');
  body.className = 'form-grid';
  body.innerHTML = `
    <div class="form-field full">
      <label>Título</label>
      <input class="input" name="title" value="${esc(n?.title || '')}">
    </div>
    <div class="form-field full">
      <label>Texto</label>
      <textarea class="input" name="text">${esc(n?.text || '')}</textarea>
    </div>
    <div class="form-field">
      <label>Tag</label>
      <input class="input" name="tag" value="${esc(n?.tag || '')}" placeholder="Ex: Planejamento">
    </div>
  `;
  openModal({
    title: isEdit ? 'Editar nota' : 'Nova nota',
    body,
    actions: [
      { label:'Cancelar', className:'btn-ghost', onClick:(c)=>c() },
      { label: isEdit ? 'Salvar' : 'Adicionar', className:'btn-primary', onClick:(close)=>{
        const fd = new FormData(body);
        const data = {
          title: (fd.get('title')||'').trim(),
          text: (fd.get('text')||'').trim(),
          tag: (fd.get('tag')||'').trim(),
          date: new Date().toISOString()
        };
        if (!data.title && !data.text){ toast('Preencha algo', 'error'); return; }
        if (isEdit) Object.assign(n, data);
        else state.notes.push({ id: uid('note'), ...data });
        saveState();
        refresh();
        toast(isEdit ? 'Nota salva' : 'Nota adicionada', 'success');
        close();
      }}
    ]
  });
}

/* ============================================================
   CONFIGURAÇÕES
============================================================ */
function renderSettingsSection(root){
  const wrap = document.createElement('div');
  const s = state.settings;

  wrap.innerHTML = `
    <div class="panel" style="margin-bottom:20px;max-width:720px">
      <div class="panel-head">
        <div>
          <div class="panel-title">Canal</div>
          <div class="panel-sub">Informações gerais sobre seu canal</div>
        </div>
      </div>
      <div class="panel-body">
        <div class="form-grid">
          <div class="form-field full">
            <label>Nome do canal</label>
            <input class="input" id="set-channelName" value="${esc(s.channelName || '')}">
          </div>
          <div class="form-field full">
            <label>Descrição</label>
            <textarea class="input" id="set-desc">${esc(s.channelDescription || '')}</textarea>
          </div>
          <div class="form-field">
            <label>Nicho principal</label>
            <input class="input" id="set-niche" value="${esc(s.niche || '')}">
          </div>
          <div class="form-field">
            <label>Meta de vídeos por mês</label>
            <input class="input" type="number" id="set-goal" min="0" value="${s.monthlyGoal || 0}">
          </div>
        </div>
        <div style="margin-top:16px">
          <button class="btn btn-primary" id="save-settings">Salvar configurações</button>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:20px;max-width:720px">
      <div class="panel-head">
        <div>
          <div class="panel-title">Aparência</div>
          <div class="panel-sub">Tema da interface</div>
        </div>
      </div>
      <div class="panel-body">
        <div style="display:flex;gap:8px">
          <button class="btn ${s.theme==='light'?'btn-primary':''}" data-theme-set="light">☀ Claro</button>
          <button class="btn ${s.theme==='dark'?'btn-primary':''}" data-theme-set="dark">🌙 Escuro</button>
        </div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:20px;max-width:720px">
      <div class="panel-head">
        <div>
          <div class="panel-title">Dados</div>
          <div class="panel-sub">Exportar, importar ou apagar tudo</div>
        </div>
      </div>
      <div class="panel-body">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary" id="export-btn">⬇ Exportar dados (.json)</button>
          <button class="btn btn-secondary" id="import-btn">⬆ Importar dados</button>
          <button class="btn btn-danger" id="clear-btn">${ICONS.trash} Apagar todos os dados</button>
        </div>
        <input type="file" id="import-file" accept=".json" style="display:none">
        <div style="margin-top:14px;font-size:12px;color:var(--muted)">
          Os dados ficam salvos apenas no seu navegador (LocalStorage). Exporte regularmente para não perder nada.
        </div>
      </div>
    </div>

    <div class="panel" style="max-width:720px">
      <div class="panel-head">
        <div>
          <div class="panel-title">Sobre</div>
          <div class="panel-sub">CreatorFlow · v1.0</div>
        </div>
      </div>
      <div class="panel-body" style="font-size:13px;color:var(--text-soft);line-height:1.6">
        Workspace pessoal para planejamento e produção de conteúdo no YouTube.<br>
        Sem backend, sem APIs externas — tudo no seu navegador.
      </div>
    </div>
  `;
  root.appendChild(wrap);

  wrap.querySelector('#save-settings').onclick = () => {
    state.settings.channelName = wrap.querySelector('#set-channelName').value.trim();
    state.settings.channelDescription = wrap.querySelector('#set-desc').value.trim();
    state.settings.niche = wrap.querySelector('#set-niche').value.trim();
    state.settings.monthlyGoal = +wrap.querySelector('#set-goal').value || 0;
    saveState();
    toast('Configurações salvas', 'success');
    updateFooter();
  };

  $$('[data-theme-set]', wrap).forEach(btn => {
    btn.onclick = () => {
      state.settings.theme = btn.dataset.themeSet;
      document.documentElement.setAttribute('data-theme', state.settings.theme);
      saveState();
      refresh();
    };
  });

  wrap.querySelector('#export-btn').onclick = () => {
    const clean = { ...state };
    // remove flag de demo para exportação (opcional - mantemos)
    const json = JSON.stringify(clean, null, 2);
    const stamp = new Date().toISOString().slice(0,10);
    download(`creatorflow-backup-${stamp}.json`, json);
    toast('Backup exportado', 'success');
  };

  wrap.querySelector('#import-btn').onclick = () => wrap.querySelector('#import-file').click();
  wrap.querySelector('#import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const parsed = JSON.parse(ev.target.result);
        confirmDialog({
          title:'Importar dados',
          message:'Isso substituirá todos os dados atuais. Continuar?',
          confirmLabel:'Importar',
          onConfirm: () => {
            const base = emptyData();
            state = Object.assign(base, parsed);
            state.settings = Object.assign({...DEFAULT_SETTINGS}, parsed.settings || {});
            saveState();
            document.documentElement.setAttribute('data-theme', state.settings.theme || 'light');
            updateFooter();
            refresh();
            toast('Dados importados', 'success');
          }
        });
      }catch(err){
        toast('Arquivo inválido', 'error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  wrap.querySelector('#clear-btn').onclick = () => {
    confirmDialog({
      title:'Apagar todos os dados',
      message:'Tem certeza absoluta? Isso excluirá TODOS os dados (ideias, vídeos, roteiros, etc). Não será possível desfazer.',
      confirmLabel:'Apagar tudo',
      onConfirm: () => {
        clearAllData();
        refresh();
        updateFooter();
        toast('Todos os dados foram apagados', 'success');
      }
    });
  };
}

/* ============================================================
   BUSCA GLOBAL
============================================================ */
function setupGlobalSearch(){
  const input = $('#global-search');
  input.addEventListener('input', debounce(() => {
    const q = input.value.trim().toLowerCase();
    if (!q){ clearSearchResults(); return; }
    showSearchResults(q);
  }, 200));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ input.value = ''; clearSearchResults(); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) clearSearchResults();
  });
}

function clearSearchResults(){
  const existing = $('#search-results');
  if (existing) existing.remove();
}

function showSearchResults(q){
  clearSearchResults();
  const results = [];
  state.ideas.forEach(i => {
    if ((i.title||'').toLowerCase().includes(q) || (i.description||'').toLowerCase().includes(q))
      results.push({ type:'Ideia', label:i.title, action:() => openIdeaModal(i.id) });
  });
  state.videos.forEach(v => {
    if ((v.workTitle||'').toLowerCase().includes(q) || (v.finalTitle||'').toLowerCase().includes(q))
      results.push({ type:'Vídeo', label:v.workTitle, action:() => openVideoDrawer(v.id) });
  });
  state.scripts.forEach(s => {
    if ((s.title||'').toLowerCase().includes(q) || (s.content||'').toLowerCase().includes(q))
      results.push({ type:'Roteiro', label:s.title, action:() => { navigate('scripts'); setTimeout(() => openScriptEditor(s.id), 100); } });
  });
  state.library.forEach(l => {
    if ((l.name||'').toLowerCase().includes(q) || (l.url||'').toLowerCase().includes(q))
      results.push({ type:'Referência', label:l.name, action:() => openLibraryModal(l.id) });
  });
  state.notes.forEach(n => {
    if ((n.title||'').toLowerCase().includes(q) || (n.text||'').toLowerCase().includes(q))
      results.push({ type:'Nota', label:n.title, action:() => openNoteModal(n.id) });
  });

  const wrap = document.createElement('div');
  wrap.id = 'search-results';
  wrap.style.cssText = `
    position:absolute;top:100%;right:0;margin-top:6px;
    background:var(--panel);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-lg);
    min-width:320px;max-width:480px;max-height:400px;overflow-y:auto;
    z-index:60;padding:6px;
  `;
  if (results.length === 0){
    wrap.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Nenhum resultado para "${esc(q)}".</div>`;
  } else {
    results.slice(0, 30).forEach(r => {
      const item = document.createElement('button');
      item.style.cssText = `
        display:flex;align-items:center;gap:10px;width:100%;
        padding:8px 10px;border-radius:6px;text-align:left;
        font-size:13px;color:var(--text);
      `;
      item.onmouseenter = () => item.style.background = 'var(--bg-soft)';
      item.onmouseleave = () => item.style.background = '';
      item.innerHTML = `<span class="badge">${esc(r.type)}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>`;
      item.onclick = () => { clearSearchResults(); input.value = ''; r.action(); };
      wrap.appendChild(item);
    });
  }
  $('.search-wrap').appendChild(wrap);
}

/* ============================================================
   FOOTER / TEMA
============================================================ */
function updateFooter(){
  const el = $('#footer-channel');
  if (el) el.textContent = state.settings.channelName || 'Meu Canal';
}

function setupTheme(){
  const btn = $('#theme-toggle');
  btn.onclick = () => {
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.settings.theme);
    saveState();
  };
}

/* ============================================================
   BOOT
============================================================ */
function setupMobileMenu(){
  $('#menu-toggle').onclick = () => document.body.classList.toggle('sidebar-open');
  document.addEventListener('click', e => {
    if (document.body.classList.contains('sidebar-open')){
      if (!e.target.closest('#sidebar') && !e.target.closest('#menu-toggle')){
        document.body.classList.remove('sidebar-open');
      }
    }
  });
}

function boot(){
  loadState();
  document.documentElement.setAttribute('data-theme', state.settings.theme || 'light');
  updateFooter();
  renderNav();
  navigate('dashboard');
  setupTheme();
  setupGlobalSearch();
  setupMobileMenu();

  // Mensagem de boas-vindas na primeira vez
  if (state.settings.firstRun !== false){
    state.settings.firstRun = false;
    saveState();
    setTimeout(() => {
      toast('Bem-vindo ao CreatorFlow!', 'success');
    }, 400);
  }
}

boot();
</script>
</body>
</html>
