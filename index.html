  main.innerHTML = `
  ${topbar()}
  <div class="grid" style="grid-template-columns:1fr 2fr;gap:16px" id="midia-grid">
    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="label">Adicionar</div>
        <div class="field"><label>Título</label><input class="input" id="media-title" placeholder="Ex.: Duna, Dark, Frieren..."></div>
        <div class="row">
          <div class="field"><label>Tipo</label><select class="input" id="media-type">${MEDIA_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
          <div class="field"><label>Status</label><select class="input" id="media-status">${Object.entries(MEDIA_STATUS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
        </div>
        <button class="btn btn-primary" onclick="addMedia()">Cadastrar</button>
      </div>
      <div class="card">
        <div class="label">Estou vendo agora</div>
        ${watching.length ? watching.map(m=>`<div class="line-item" style="margin-top:8px"><div class="li-body"><div class="li-title">${esc(m.title)}</div><div class="li-sub">${esc(m.type)}</div></div></div>`).join('') : '<div class="empty">Nada em andamento.</div>'}
      </div>
    </div>
    <div class="card">
      <div class="tabs">
        <button class="tab ${filter==='todos'?'active':''}" onclick="state._mediaFilter='todos';renderMain()">Todos (${state.media.length})</button>
        ${MEDIA_TYPES.map(t=>`<button class="tab ${filter===t?'active':''}" onclick="state._mediaFilter='${t}';renderMain()">${t} (${state.media.filter(m=>m.type===t).length})</button>`).join('')}
      </div>
      ${items.map(itemHTML).join('') || '<div class="empty">Nada aqui ainda. Cadastre o primeiro.</div>'}
    </div>
  </div>
  <style>@media(max-width:900px){#midia-grid{grid-template-columns:1fr !important}}</style>`;
}
function addMedia(){
  const title = $('#media-title').value.trim(); if(!title){ toast('Qual é o título?'); return; }
  state.media.push({ id:'m'+Date.now(), title, type:$('#media-type').value, status:$('#media-status').value, rating:0, note:'' });
  registerActiveDay(); checkAchievements(); saveState(); renderMain();
}
function rateMedia(id, v){
  const m = state.media.find(x=>x.id===id); if(!m) return;
  m.rating = (m.rating===v) ? 0 : v;
  saveState(); renderMain();
}
function setMediaStatus(id, v){
  const m = state.media.find(x=>x.id===id); if(!m) return;
  const wasDone = m.status==='feito';
  m.status = v;
  if (v==='feito' && !wasDone){ registerActiveDay(); addXP(CFG.xpRewards.mediaDone, `Concluiu: ${m.title}`, 'media'); }
  saveState(); renderMain();
}
function deleteMedia(id){ state.media = state.media.filter(m=>m.id!==id); saveState(); renderMain(); }

/* ==========================================================
   CANAL NO YOUTUBE — pipeline de vídeos
   ========================================================== */
const YT_STAGES = [
  { id:'ideia',    name:'Ideia' },
  { id:'roteiro',  name:'Roteiro' },
  { id:'gravacao', name:'Gravação' },
  { id:'edicao',   name:'Edição' },
  { id:'publicado',name:'Publicado' }
];
function pageYoutube(main){
  const cols = YT_STAGES.map(st=>{
    const vids = state.videos.filter(v=>v.status===st.id);
    return `<div class="kcol">
      <div class="khead">${st.name} · ${vids.length}</div>
      ${vids.map(v=>`
        <div class="kcard" onclick="editVideo('${v.id}')">
          <div class="kt">${esc(v.title)}</div>
          ${v.hook?`<div style="font-size:10px;color:var(--muted);margin-top:4px">🎣 ${esc(v.hook.slice(0,60))}</div>`:''}
          <div class="km" onclick="event.stopPropagation()">
            ${st.id!=='ideia'?`<button onclick="moveVideo('${v.id}',-1)">←</button>`:'<span></span>'}
            <button onclick="deleteVideo('${v.id}')">✕</button>
            ${st.id!=='publicado'?`<button onclick="moveVideo('${v.id}',1)">→</button>`:'<span></span>'}
          </div>
        </div>`).join('')}
    </div>`;
  }).join('');
  const published = state.videos.filter(v=>v.status==='publicado').length;
  main.innerHTML = `
  ${topbar()}
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div class="label">Pipeline do canal</div>
        <div class="sub">${state.videos.length} vídeo(s) em jogo · ${published} publicado(s) · roteiro pronto +${CFG.xpRewards.scriptDone} XP · publicar +${CFG.xpRewards.videoPublished} XP</div>
      </div>
      <div class="row" style="flex:0 1 420px">
        <input class="input" id="yt-title" placeholder="Título/ideia do vídeo..." onkeydown="if(event.key==='Enter')addVideo()">
        <button class="btn btn-primary" style="flex:0 0 auto" onclick="addVideo()">+ Ideia</button>
      </div>
    </div>
  </div>
  <div class="week-scroll"><div class="kanban">${cols}</div></div>
  <div class="sub" style="margin-top:12px;color:var(--faint)">Clique num card para escrever gancho, roteiro e tags. Uma ideia solta aqui não precisa virar vídeo — o banco de ideias existe para isso.</div>`;
}
function addVideo(){
  const title = $('#yt-title').value.trim(); if(!title) return;
  state.videos.push({ id:'v'+Date.now(), title, status:'ideia', hook:'', script:'', tags:'', createdAt:todayKey() });
  logHistory(`Ideia de vídeo: ${title}`);
  registerActiveDay(); saveState(); renderMain();
}
function moveVideo(id, dir){
  const v = state.videos.find(x=>x.id===id); if(!v) return;
  const idx = YT_STAGES.findIndex(s=>s.id===v.status);
  const next = YT_STAGES[idx+dir]; if(!next) return;
  v.status = next.id;
  registerActiveDay();
  if (next.id==='gravacao') addXP(CFG.xpRewards.scriptDone, `Roteiro pronto: ${v.title}`, 'quest');
  if (next.id==='publicado'){
    addXP(CFG.xpRewards.videoPublished, `Vídeo publicado: ${v.title} 🎉`, 'quest');
    logHistory(`Vídeo publicado: ${v.title}`);
  }
  saveState(); renderMain();
}
function deleteVideo(id){ state.videos = state.videos.filter(v=>v.id!==id); saveState(); renderMain(); }
function editVideo(id){
  const v = state.videos.find(x=>x.id===id); if(!v) return;
  const root = $('#overlay-root');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="panel" style="text-align:left;width:min(560px,100%)">
    <h2 style="font-size:19px">${esc(v.title)}</h2>
    <div class="field"><label>Título</label><input class="input" id="ev-title" value="${esc(v.title)}"></div>
    <div class="field"><label>Gancho (primeiros 5 segundos)</label><input class="input" id="ev-hook" value="${esc(v.hook)}" placeholder="A frase que segura quem assiste"></div>
    <div class="field"><label>Roteiro / notas</label><textarea class="input" id="ev-script" style="min-height:140px" placeholder="Estrutura, tópicos, falas...">${esc(v.script)}</textarea></div>
    <div class="field"><label>Tags</label><input class="input" id="ev-tags" value="${esc(v.tags)}" placeholder="separadas por vírgula"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-soft" onclick="this.closest('.overlay').remove()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveVideo('${v.id}')">Salvar</button>
    </div>
  </div>`;
  root.appendChild(ov);
}
function saveVideo(id){
  const v = state.videos.find(x=>x.id===id); if(!v) return;
  v.title = $('#ev-title').value.trim() || v.title;
  v.hook = $('#ev-hook').value.trim();
  v.script = $('#ev-script').value;
  v.tags = $('#ev-tags').value.trim();
  saveState();
  $('#overlay-root').innerHTML = '';
  renderMain(); toast('Vídeo atualizado.');
}
</script>

        <div class="li-body" style="flex:1"><div class="li-title">Avatar de perfil</div><div class="li-sub">Aparece na barra lateral</div></div>

function saveProfile(){
  state.user.name = $('#cfg-name').value.trim();
  state.user.title = $('#cfg-title').value.trim();
  saveState(); renderAll(); toast('Perfil salvo.');
}
function setAvatar(a){ state.user.avatar = a; saveState(); renderAll(); }
function toggleCalm(){ state.calm = !state.calm; applyCalm(); saveState(); renderMain(); }
function applyCalm(){ document.body.classList.toggle('calm', !!state.calm); }

/* ---------- Upload de imagens (comprimidas para caber no localStorage) ---------- */
function uploadImage(key){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 8*1024*1024){ toast('Imagem muito grande (máx. 8 MB).'); return; }
    const img = new Image();
    const url = URL.createObjectURL(f);
    img.onload = () => {
      const MAX = 320;
      const s = Math.min(1, MAX/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      try {
        state.images[key] = c.toDataURL('image/jpeg', 0.85);
        saveState(); renderAll(); toast('Imagem salva ✓');
      } catch(e){ toast('Não coube no armazenamento — tente uma imagem menor.'); }
      URL.revokeObjectURL(url);
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Não consegui ler essa imagem.'); };
    img.src = url;
  };
  inp.click();
}
function chooseClass(id){
  if (!isFeatureUnlocked('classes')) return;
  state.class = id;
  const c = CFG.classes.find(x=>x.id===id);
  logHistory(`Classe escolhida: ${c.name}`);
  saveState(); renderMain();
  toast(`${c.icon} Classe ${c.name} ativada — ${c.bonus}`);
}

/* ---------- Exportar / Importar / Resetar ---------- */
function exportSave(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lifeos-save-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Save exportado.');
}
function importSave(ev){
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (typeof s.xp !== 'number') throw new Error('formato inválido');
      state = Object.assign(defaultState(), s);
      ensureToday(); applyCalm(); saveState(); renderAll();
      toast('Save importado. Bem-vinda de volta.');
    } catch(e){ toast('Arquivo inválido — nada foi alterado.'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}
function resetProgress(){
  showConfirm(
    'Resetar todo o progresso?',
    'Isso apaga XP, ranks, desbloqueios e todos os dados deste navegador. Exporte um backup antes, se quiser guardar.',
    () => {
      localStorage.removeItem(CFG.storageKey);
      location.reload();
    }
  );
}
function showConfirm(title, body, onYes){
  const root = $('#overlay-root');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="panel">
    <h2>${esc(title)}</h2><p>${esc(body)}</p>
    <div class="row" style="justify-content:center">
      <button class="btn btn-soft" id="cf-no">Cancelar</button>
      <button class="btn btn-danger" id="cf-yes">Sim, resetar</button>
    </div></div>`;
  root.appendChild(ov);
  $('#cf-no', ov).onclick = ()=>ov.remove();
  $('#cf-yes', ov).onclick = ()=>{ ov.remove(); onYes(); };
}

/* ==========================================================
   28. ONBOARDING — primeiro acesso quase vazio
   ========================================================== */
function showOnboarding(){
  const root = $('#overlay-root');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="panel" style="text-align:left">
    <div style="text-align:center;margin-bottom:18px">
      <div style="font-family:var(--font-display);font-size:12px;letter-spacing:5px;color:var(--cyan);font-weight:700">BEM-VINDA AO</div>
      <div style="font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-1px;margin:4px 0">LIFE OS</div>
      <div class="bar" style="max-width:220px;margin:14px auto 0"><i style="width:0%"></i></div>
      <div style="font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:1.5px">RANK 1 · INICIANTE · 0 / ${CFG.ranks[1].req.xp} XP</div>
    </div>
    <p style="text-align:center">Você não precisa organizar sua vida inteira.<br>Vamos começar com <b style="color:var(--cyan)">três coisas</b>.</p>
    <div style="background:rgba(6,12,38,.6);border:1px solid rgba(96,140,255,.2);border-radius:14px;padding:14px 18px;margin-bottom:18px">
      ${CFG.microActions.map(m=>`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px">
        <span style="color:var(--cyan);font-family:var(--font-display)">${m.time}</span><span>${esc(m.name)}</span><span style="color:var(--faint)">○</span>
      </div>`).join('')}
    </div>
    <div class="field"><label>Como posso te chamar?</label>
    <input class="input" id="ob-name" placeholder="Seu nome" maxlength="30" onkeydown="if(event.key==='Enter')finishOnboarding()"></div>
    <button class="btn btn-primary" style="width:100%;padding:14px" onclick="finishOnboarding()">Começar pequeno</button>
    <p style="text-align:center;margin:14px 0 0;font-size:11px;color:var(--faint)">Constância antes de complexidade. O resto do sistema desbloqueia sozinho.</p>
  </div>`;
  root.appendChild(ov);
  setTimeout(()=>{ const el=$('#ob-name'); if(el) el.focus(); }, 100);
}
function finishOnboarding(){
  const name = ($('#ob-name').value || '').trim();
  state.user.name = name || 'viajante';
  logHistory('Life OS iniciado');
  saveState();
  $('#overlay-root').innerHTML = '';
  renderAll();
  toast(`Bem-vinda, ${state.user.name}. Três coisas. Só isso hoje.`);
}

/* ==========================================================
   36. initializeApp
   ========================================================== */
function initializeApp(){
  state = loadState();
  const firstAccess = !state;
  if (firstAccess) state = defaultState();
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) state.calm = true;
  applyCalm();
  ensureToday();
  if (!firstAccess) checkReturn();
  checkUnlocks();
  saveState();
  renderAll();
  if (firstAccess) showOnboarding();
}
initializeApp();
</script>
