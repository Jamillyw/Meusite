<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreatorFlow — Workspace de Conteúdo</title>
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root{
  --bg:#f5f6f8;
  --bg-soft:#eef0f4;
  --panel:#ffffff;
  --panel-2:#fafbfc;
  --text:#1a1d23;
  --text-soft:#4a5160;
  --muted:#7a8290;
  --border:#e6e8ec;
  --border-strong:#d5d8de;
  --primary:#5b5bd6;
  --primary-hover:#4a4ac4;
  --primary-soft:#ececff;
  --success:#0ea36b;
  --success-soft:#e2f7ee;
  --warning:#d97706;
  --warning-soft:#fef3dc;
  --danger:#dc2626;
  --danger-soft:#fde7e7;
  --info:#0d74ce;
  --info-soft:#e3f0fd;
  --radius:12px;
  --radius-sm:8px;
  --radius-lg:16px;
  --shadow-xs:0 1px 2px rgba(16,20,40,0.04);
  --shadow-sm:0 1px 3px rgba(16,20,40,0.06),0 1px 2px rgba(16,20,40,0.04);
  --shadow-md:0 4px 12px rgba(16,20,40,0.07),0 2px 4px rgba(16,20,40,0.04);
  --shadow-lg:0 16px 40px rgba(16,20,40,0.14),0 4px 12px rgba(16,20,40,0.08);
  --sp:8px;
  --sidebar-w:248px;
  --topbar-h:60px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0d0f14;
  --bg-soft:#12151c;
  --panel:#171a22;
  --panel-2:#1d212b;
  --text:#e8eaee;
  --text-soft:#b6bcc9;
  --muted:#858d9e;
  --border:#252a35;
  --border-strong:#333a49;
  --primary:#7c83ff;
  --primary-hover:#8f95ff;
  --primary-soft:#242a45;
  --success:#34d399;
  --success-soft:#14342a;
  --warning:#fbbf24;
  --warning-soft:#3a2e12;
  --danger:#f87171;
  --danger-soft:#3a1e1e;
  --info:#60a5fa;
  --info-soft:#152a44;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.3);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.4);
  --shadow-md:0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--primary-soft)}

/* Scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ============================================================
   LAYOUT
============================================================ */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:var(--sidebar-w);
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  flex-shrink:0;
  transition:transform .25s ease;
  z-index:40;
}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:var(--topbar-h);
  display:flex;align-items:center;gap:12px;
  padding:0 20px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#content{
  flex:1;
  overflow-y:auto;
  padding:24px 28px 60px;
}

/* ============================================================
   SIDEBAR
============================================================ */
.brand{
  padding:18px 20px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.brand-logo{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
  color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:13px;letter-spacing:-.02em;
}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-2px}

.nav{padding:12px 10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-section-label{
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:14px 10px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:8px;
  color:var(--text-soft);font-weight:500;font-size:13.5px;
  transition:background .15s,color .15s;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg-soft);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-item .count{
  margin-left:auto;font-size:11px;font-weight:600;
  background:var(--bg-soft);color:var(--muted);
  padding:1px 7px;border-radius:99px;min-width:22px;text-align:center;
}
.nav-item.active .count{background:var(--panel);color:var(--primary)}

.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* ============================================================
   TOPBAR
============================================================ */
.topbar h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.topbar-actions{display:flex;align-items:center;gap:8px}
.search-wrap{position:relative}
.search-wrap svg{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--muted);pointer-events:none;
}
#global-search{
  width:260px;height:34px;
  padding:0 12px 0 32px;
  background:var(--bg-soft);border:1px solid transparent;
  border-radius:8px;font-size:13px;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
#global-search:focus{
  outline:none;background:var(--panel);border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}

.icon-btn{
  width:34px;height:34px;border-radius:8px;
  display:grid;place-items:center;color:var(--text-soft);
  transition:background .15s,color .15s;
}
.icon-btn:hover{background:var(--bg-soft);color:var(--text)}
.icon-btn svg{width:16px;height:16px}

#menu-toggle{display:none}

/* ============================================================
   BUTTONS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 14px;border-radius:8px;
  font-size:13px;font-weight:600;letter-spacing:-.005em;
  background:var(--bg-soft);color:var(--text);
  transition:background .15s,color .15s,box-shadow .15s,transform .05s;
  white-space:nowrap;
}
.btn:hover{background:var(--border)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:transparent;color:var(--text-soft)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============================================================
   CARDS / PANELS
============================================================ */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-xs);
}
.panel-head{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.panel-title{font-weight:700;font-size:14px;letter-spacing:-.01em}
.panel-sub{font-size:12px;color:var(--muted);margin-top:1px}
.panel-body{padding:16px 18px}

/* ============================================================
   DASHBOARD
============================================================ */
.dash-hero{
  background:linear-gradient(135deg,var(--primary) 0%,#8b5cf6 100%);
  border-radius:var(--radius-lg);
  padding:24px 28px;color:#fff;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.dash-hero::after{
  content:'';position:absolute;right:-80px;top:-80px;
  width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.dash-hero h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.dash-hero p{font-size:14px;opacity:.9;max-width:640px}

.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:22px;
}
.stat{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;
  box-shadow:var(--shadow-xs);
  transition:box-shadow .15s,transform .15s;
}
.stat:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.stat-label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.stat-label svg{width:14px;height:14px}
.stat-value{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1}
.stat-hint{font-size:11.5px;color:var(--muted);margin-top:6px}

.dash-2col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.dash-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}

.pipeline{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:16px 18px;
}
.pipe-step{
  padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;
  background:var(--bg-soft);color:var(--text-soft);position:relative;
  white-space:nowrap;
}
.pipe-step.hot{background:var(--primary-soft);color:var(--primary)}
.pipe-arrow{color:var(--muted);font-size:12px}

.insight{
  display:flex;gap:12px;padding:12px 14px;
  border-radius:10px;background:var(--bg-soft);
  font-size:13px;margin-bottom:8px;
}
.insight-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px;
}
.insight-dot.warn{background:var(--warning)}
.insight-dot.info{background:var(--info)}
.insight-dot.success{background:var(--success)}
.insight-dot.danger{background:var(--danger)}

.quick-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.quick-item:last-child{border-bottom:none}
.quick-item-title{font-weight:600;font-size:13px;color:var(--text);line-height:1.35}
.quick-item-meta{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ============================================================
   LISTS / TOOLBAR
============================================================ */
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:16px;
}
.toolbar .grow{flex:1;min-width:200px}
.input,select.input,textarea.input{
  width:100%;height:34px;padding:0 12px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:8px;font-size:13px;
  transition:border-color .15s,box-shadow .15s;
}
textarea.input{height:auto;padding:10px 12px;resize:vertical;min-height:80px;line-height:1.5}
.input:focus,textarea.input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a8290' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;background-size:12px;padding-right:30px}

/* ============================================================
   IDEA CARDS
============================================================ */
.cards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
}
.idea-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-xs);cursor:pointer;
  transition:box-shadow .15s,transform .15s,border-color .15s;
  display:flex;flex-direction:column;gap:10px;
}
.idea-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--border-strong)}
.idea-card-title{font-weight:700;font-size:14.5px;line-height:1.35;letter-spacing:-.01em}
.idea-card-desc{font-size:12.5px;color:var(--text-soft);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.idea-card-meta{font-size:11.5px;color:var(--muted)}

/* ============================================================
   BADGES / TAGS
============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;
  background:var(--bg-soft);color:var(--text-soft);
  white-space:nowrap;
}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.badge.success{background:var(--success-soft);color:var(--success)}
.badge.warning{background:var(--warning-soft);color:var(--warning)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.tag{
  display:inline-flex;font-size:11px;font-weight:500;
  padding:2px 7px;border-radius:5px;
  background:var(--bg-soft);color:var(--text-soft);
  border:1px solid var(--border);
}

/* Priority indicator */
.prio{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prio.baixa{background:#94a3b8}
.prio.media{background:var(--info)}
.prio.alta{background:var(--warning)}
.prio.urgente{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}

/* ============================================================
   PROGRESS
============================================================ */
.progress{
  height:6px;border-radius:99px;background:var(--bg-soft);
  overflow:hidden;width:100%;
}
.progress-bar{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--primary),#8b5cf6);
  transition:width .35s ease;
}
.progress.small{height:4px}

/* ============================================================
   KANBAN
============================================================ */
.kanban{
  display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;
  min-height:calc(100vh - 220px);
}
.kanban-col{
  flex:0 0 260px;background:var(--bg-soft);
  border-radius:var(--radius);padding:10px;
  display:flex;flex-direction:column;gap:8px;
  transition:background .15s;
}
.kanban-col.dragover{background:var(--primary-soft);outline:2px dashed var(--primary);outline-offset:-4px}
.kanban-head{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px 10px;font-size:12.5px;font-weight:700;
  letter-spacing:-.01em;
}
.kanban-head .count{
  margin-left:auto;font-size:11px;font-weight:600;
  color:var(--muted);background:var(--panel);
  padding:1px 7px;border-radius:99px;
}
.kanban-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:11px 12px;
  box-shadow:var(--shadow-xs);cursor:grab;
  transition:box-shadow .15s,transform .15s;
  display:flex;flex-direction:column;gap:8px;
}
.kanban-card:active{cursor:grabbing}
.kanban-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.kanban-card.dragging{opacity:.45}
.kanban-card-title{font-weight:600;font-size:13px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kanban-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.kanban-empty{
  padding:20px;text-align:center;color:var(--muted);font-size:12px;
  border:1.5px dashed var(--border-strong);border-radius:10px;
}

/* ============================================================
   SCRIPTS
============================================================ */
.script-editor{
  display:grid;grid-template-columns:1fr;gap:16px;
}
.script-meta{
  display:flex;flex-wrap:wrap;gap:16px;
  padding:12px 16px;background:var(--panel);
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:12.5px;
}
.script-meta-item{display:flex;align-items:center;gap:6px;color:var(--muted)}
.script-meta-item strong{color:var(--text);font-weight:700}
#script-content{
  width:100%;min-height:480px;padding:20px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);font-size:15px;line-height:1.7;
  resize:vertical;font-family:inherit;
}
#script-content:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

.blocks-list{display:flex;flex-direction:column;gap:8px}
.block-item{
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
}
.block-item.dragging{opacity:.4}
.block-head{display:flex;align-items:center;gap:8px}
.block-name{
  font-weight:700;font-size:12.5px;letter-spacing:-.01em;
  padding:4px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary);
}
.block-content{
  width:100%;min-height:60px;padding:8px 10px;
  background:var(--bg-soft);border:1px solid transparent;
  border-radius:6px;font-size:13px;line-height:1.55;resize:vertical;
}
.block-content:focus{outline:none;background:var(--panel);border-color:var(--primary)}

.grip{
  cursor:grab;color:var(--muted);width:16px;height:16px;
  display:grid;place-items:center;user-select:none;
}
.grip:active{cursor:grabbing}

/* Focus mode */
body.focus-mode .sidebar{transform:translateX(-100%);position:fixed;left:0;top:0;height:100vh}
body.focus-mode .topbar .search-wrap,
body.focus-mode .topbar-actions #global-search{display:none}

/* ============================================================
   CALENDAR
============================================================ */
.cal-header{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;
}
.cal-title{font-size:16px;font-weight:700;letter-spacing:-.01em;min-width:200px;text-align:center}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:6px;background:var(--border);padding:6px;border-radius:var(--radius);
}
.cal-dow{
  background:var(--panel);padding:8px 10px;text-align:center;
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);border-radius:6px;
}
.cal-cell{
  background:var(--panel);min-height:110px;padding:8px;
  border-radius:6px;display:flex;flex-direction:column;gap:4px;
  transition:background .15s;
}
.cal-cell:hover{background:var(--panel-2)}
.cal-cell.other{opacity:.4}
.cal-cell.today{outline:2px solid var(--primary);outline-offset:-2px}
.cal-date{font-size:12px;font-weight:700;color:var(--text-soft)}
.cal-event{
  font-size:11.5px;padding:4px 6px;border-radius:5px;
  background:var(--primary-soft);color:var(--primary);
  font-weight:600;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-left:3px solid var(--primary);
}
.cal-event.publicado{background:var(--success-soft);color:var(--success);border-left-color:var(--success)}
.cal-event.atrasado{background:var(--danger-soft);color:var(--danger);border-left-color:var(--danger)}
.cal-event.agendado{background:var(--info-soft);color:var(--info);border-left-color:var(--info)}
.cal-event:hover{filter:brightness(.96)}

/* ============================================================
   MODAL / DRAWER
============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,18,30,.5);
  backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{
  background:var(--panel);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);
  width:100%;max-width:640px;max-height:88vh;
  display:flex;flex-direction:column;
  animation:slideUp .2s ease;
}
.modal.wide{max-width:900px}
.modal-head{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.modal-head h3{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-foot{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
}

/* Drawer (video detail) */
.drawer-overlay{
  position:fixed;inset:0;background:rgba(15,18,30,.5);
  backdrop-filter:blur(2px);z-index:100;
  animation:fadeIn .15s ease;
}
.drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:min(760px,100%);
  background:var(--panel);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
  z-index:101;
  animation:slideIn .25s ease;
}
@keyframes slideIn{from{transform:translateX(30px);opacity:.5}to{transform:translateX(0);opacity:1}}
.drawer-head{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-tabs{
  display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.drawer-tab{
  padding:10px 12px;font-size:13px;font-weight:600;
  color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;white-space:nowrap;
}
.drawer-tab:hover{color:var(--text)}
.drawer-tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ============================================================
   FORM
============================================================ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.one{grid-template-columns:1fr}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12px;font-weight:600;color:var(--text-soft)}
.form-field .hint{font-size:11px;color:var(--muted);margin-top:2px}
.form-field.full{grid-column:1/-1}

/* ============================================================
   TOAST
============================================================ */
#toasts{
  position:fixed;bottom:20px;right:20px;
  display:flex;flex-direction:column;gap:8px;
  z-index:200;pointer-events:none;
}
.toast{
  background:var(--panel);border:1px solid var(--border);
  border-left:3px solid var(--primary);
  padding:11px 14px;border-radius:10px;
  box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:8px;
  min-width:220px;max-width:360px;
  animation:slideUp .2s ease;
  pointer-events:auto;
}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast svg{width:16px;height:16px;flex-shrink:0}

/* ============================================================
   EMPTY STATE
============================================================ */
.empty{
  text-align:center;padding:60px 20px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty svg{width:44px;height:44px;color:var(--muted);opacity:.6}
.empty h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.empty p{font-size:13px;color:var(--muted);max-width:400px}
.empty .btn{margin-top:6px}

/* ============================================================
   CHECKLIST
============================================================ */
.checklist{display:flex;flex-direction:column;gap:6px}
.check-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:8px;
  transition:border-color .15s;
}
.check-item:hover{border-color:var(--border-strong)}
.check-item.dragging{opacity:.4}
.check-item.done .check-text{text-decoration:line-through;color:var(--muted)}
.checkbox{
  width:16px;height:16px;border-radius:5px;
  border:1.5px solid var(--border-strong);
  display:grid;place-items:center;flex-shrink:0;
  margin-top:1px;transition:background .15s,border-color .15s;
}
.checkbox:hover{border-color:var(--primary)}
.check-item.done .checkbox{background:var(--primary);border-color:var(--primary)}
.checkbox svg{width:10px;height:10px;color:#fff;opacity:0}
.check-item.done .checkbox svg{opacity:1}
.check-text{font-size:13px;font-weight:500;flex:1;line-height:1.4}

/* ============================================================

============================================================ */
@media (max-width:1024px){

const $ = (sel, root=document) => root.querySelector(sel);

function uid(prefix='id'){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}
function esc(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateShort(d){
  if (!d) return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}
function toDateInput(d){
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return '';
  return dt.toISOString().slice(0,10);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isOverdue(d){
  if (!d) return false;
  return new Date(d) < new Date(todayStr());
}
function timeAgo(ts){
  if (!ts) return '';
  const diff = Date.now() - new Date(ts).getTime();
  const min = Math.floor(diff/60000);
  if (min < 1) return 'agora';
  if (min < 60) return min + 'min atrás';
  const h = Math.floor(min/60);
  if (h < 24) return h + 'h atrás';
  const d = Math.floor(h/24);
  if (d < 30) return d + 'd atrás';
  return fmtDateShort(ts);
}
function wordCount(txt){
  if (!txt) return 0;
  return txt.trim().split(/\s+/).filter(Boolean).length;
}
function estimateDuration(words){
  // 130-160 wpm -> usamos 145 como média
  const min = words / 145;
  if (min < 1) return '< 1 min';
  const m = Math.floor(min);
  const s = Math.round((min - m) * 60);
  return m + 'min' + (s>0 ? ' ' + s + 's' : '');
}
function tagList(str){
  if (!str) return [];
  return String(str).split(',').map(t => t.trim()).filter(Boolean);
}
function download(filename, text){
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================

============================================================ */
let state = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const parsed = JSON.parse(raw);
      // garante estrutura mínima
      const base = emptyData();
      state = Object.assign(base, parsed);
      state.settings = Object.assign({...DEFAULT_SETTINGS}, parsed.settings || {});
      return;
    }
  }catch(e){ console.warn('Falha ao carregar', e); }

  state = emptyData();
  // Primeira vez: carrega demo
  const demo = buildDemoData();
  Object.assign(state, demo);
  state.demoLoaded = true;
  saveState();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    toast('Erro ao salvar. Armazenamento cheio?', 'error');
  }
}

function clearAllData(){
  const theme = state.settings.theme;
  state = emptyData();
  state.settings.theme = theme;
  state.demoLoaded = true; // não recria demo
  saveState();
}

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icon = type === 'success' ? ICONS.check
             : type === 'error' ? ICONS.close
             : ICONS.sparkles;
  el.innerHTML = `<span style="display:grid;place-items:center;color:var(--${type==='success'?'success':type==='error'?'danger':'primary'})">${icon}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition='opacity .25s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

/* Modal */
function openModal({ title, body, actions=[], wide=false, onSubmit }){
  closeModal();
  const root = $('#modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');

  const modal = document.createElement('div');
  modal.className = 'modal' + (wide ? ' wide' : '');

  const head = document.createElement('div');
  head.className = 'modal-head';
  head.innerHTML = `<h3>${esc(title)}</h3>`;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'icon-btn';
  closeBtn.setAttribute('aria-label','Fechar');
  closeBtn.innerHTML = ICONS.close;
  closeBtn.onclick = closeModal;
  head.appendChild(closeBtn);

  const bodyEl = document.createElement('div');
  bodyEl.className = 'modal-body';
  if (body instanceof Node) bodyEl.appendChild(body);
  else if (typeof body === 'string') bodyEl.innerHTML = body;

  const foot = document.createElement('div');
  foot.className = 'modal-foot';

  const form = document.createElement('form');
  form.style.display='contents';
  // usa o form para Enter
  modal.appendChild(head);
  modal.appendChild(bodyEl);
  modal.appendChild(foot);

  if (onSubmit){
    // Envolve body e foot em um form implícito via submit handler
    modal.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA' && !e.shiftKey){
        e.preventDefault();
        onSubmit(new FormData(bodyEl));
      }
    });
  }

  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (a.className || '');
    btn.textContent = a.label;
    btn.type = 'button';
    btn.onclick = () => a.onClick ? a.onClick(closeModal) : closeModal();
    foot.appendChild(btn);
  });

  overlay.appendChild(modal);
  root.appendChild(overlay);

  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', escHandler);

  // foco inicial
  setTimeout(() => {
    const first = bodyEl.querySelector('input,select,textarea,button');
    if (first) first.focus();
  }, 60);
}

function escHandler(e){
  if (e.key === 'Escape') closeModal();
}

function closeModal(){
  const root = $('#modal-root');
  root.innerHTML = '';
  document.removeEventListener('keydown', escHandler);
}

function confirmDialog({ title, message, confirmLabel='Confirmar', danger=true, onConfirm }){
  const body = document.createElement('div');
  body.innerHTML = `<p style="font-size:13.5px;line-height:1.55;color:var(--text-soft)">${esc(message)}</p>`;
  openModal({
    title: title || 'Confirmar',
    body,
    actions: [
      { label:'Cancelar', className:'btn-ghost', onClick: (close)=>close() },
      { label: confirmLabel, className: danger ? 'btn-danger' : 'btn-primary', onClick: (close)=>{ onConfirm(); close(); } }
    ]
  });
}

/* Drawer */
function openDrawer({ title, tabs, content, activeTab=0, headerExtra }){
  closeDrawer();
  const root = $('#modal-root');

  const overlay = document.createElement('div');
  overlay.className = 'drawer-overlay';
  overlay.onclick = closeDrawer;

  const drawer = document.createElement('div');
  drawer.className = 'drawer';

  const head = document.createElement('div');
  head.className = 'drawer-head';
  head.innerHTML = `<h3 style="font-size:15px;font-weight:700;flex:1;letter-spacing:-.01em">${esc(title)}</h3>`;
  if (headerExtra) head.appendChild(headerExtra);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'icon-btn';
  closeBtn.innerHTML = ICONS.close;
  closeBtn.onclick = closeDrawer;
  closeBtn.setAttribute('aria-label','Fechar');
  head.appendChild(closeBtn);

  const tabsEl = document.createElement('div');
  tabsEl.className = 'drawer-tabs';
  const bodyEl = document.createElement('div');
  bodyEl.className = 'drawer-body';

  let current = activeTab;
  function renderTab(i){
    current = i;
    $$('.drawer-tab', tabsEl).forEach((t, idx) => t.classList.toggle('active', idx === i));
    bodyEl.innerHTML = '';
    const node = content[i].render();
    if (typeof node === 'string') bodyEl.innerHTML = node;
    else bodyEl.appendChild(node);
  }

  tabs.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'drawer-tab';
    b.textContent = t;
    b.onclick = () => renderTab(i);
    tabsEl.appendChild(b);
  });

  drawer.appendChild(head);
  drawer.appendChild(tabsEl);
  drawer.appendChild(bodyEl);
  root.appendChild(overlay);
  root.appendChild(drawer);

  renderTab(current);

  document.addEventListener('keydown', drawerEsc);
  function drawerEsc(e){
    if (e.key === 'Escape'){ closeDrawer(); document.removeEventListener('keydown', drawerEsc); }
  }
}

function closeDrawer(){
  const root = $('#modal-root');
  root.innerHTML = '';
}

============================================================ */
const ROUTES = [
  { id:'dashboard', label:'Dashboard', icon:ICONS.dashboard, section:'Geral' },
  { id:'ideas', label:'Ideias', icon:ICONS.ideas, section:'Conteúdo' },
  { id:'videos', label:'Conteúdos', icon:ICONS.videos, section:'Conteúdo' },
  { id:'kanban', label:'Kanban', icon:ICONS.kanban, section:'Conteúdo' },
  { id:'scripts', label:'Roteiros', icon:ICONS.scripts, section:'Produção' },
  { id:'calendar', label:'Calendário', icon:ICONS.calendar, section:'Produção' },
  { id:'library', label:'Biblioteca', icon:ICONS.library, section:'Recursos' },
  { id:'notes', label:'Notas', icon:ICONS.notes, section:'Recursos' },
  { id:'settings', label:'Configurações', icon:ICONS.settings, section:'Geral' }
];

let currentRoute = 'dashboard';

function renderNav(){
  const nav = $('#nav');
  nav.innerHTML = '';
  let lastSection = '';
  ROUTES.forEach(r => {
    if (r.section !== lastSection){
      const lbl = document.createElement('div');
      lbl.className = 'nav-section-label';
      lbl.textContent = r.section;
      nav.appendChild(lbl);
      lastSection = r.section;
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item';
    btn.dataset.route = r.id;
    const counts = { ideas: state.ideas.length, videos: state.videos.length, scripts: state.scripts.length };
    const count = counts[r.id];
    btn.innerHTML = `${r.icon}<span>${r.label}</span>${count != null ? `<span class="count">${count}</span>` : ''}`;
    btn.onclick = () => { navigate(r.id); closeMobileSidebar(); };
    nav.appendChild(btn);
  });
  updateNavActive();
}

function updateNavActive(){
  $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.route === currentRoute));
}

function navigate(route){
  currentRoute = route;
  updateNavActive();
  const r = ROUTES.find(x => x.id === route);
  $('#page-title').textContent = r ? r.label : 'Dashboard';
  refresh();
}

function refresh(){
  renderNav();
  const content = $('#content');
  content.innerHTML = '';
  switch(currentRoute){
    case 'dashboard': renderDashboard(content); break;
    case 'ideas': renderIdeasSection(content); break;
    case 'videos': renderVideosSection(content); break;
    case 'kanban': renderKanbanSection(content); break;
    case 'scripts': renderScriptsSection(content); break;
    case 'calendar': renderCalendarSection(content); break;
    case 'library': renderLibrarySection(content); break;
    case 'notes': renderNotesSection(content); break;
    case 'settings': renderSettingsSection(content); break;
    default: renderDashboard(content);
  }
}

function closeMobileSidebar(){
  document.body.classList.remove('sidebar-open');
}

   DASHBOARD
============================================================ */
function renderDashboard(root){
  // estatísticas
  const totalIdeas = state.ideas.length;
  const inPlanning = state.videos.filter(v => ['Ideia','Planejamento','Roteiro'].includes(v.status)).length;
  const inProduction = state.videos.filter(v => ['Gravacao','Edicao','Thumbnail','Revisao'].includes(v.status)).length;
  const published = state.videos.filter(v => v.status === 'Publicado').length;
  const scriptsInProgress = state.scripts.filter(s => s.status === 'Em desenvolvimento' || s.status === 'Rascunho').length;

  // vídeos atrasados
  const overdue = state.videos.filter(v => v.publishDate && v.status !== 'Publicado' && isOverdue(v.publishDate));
  // próximo vídeo
  const upcoming = state.videos
    .filter(v => v.publishDate && v.status !== 'Publicado' && !isOverdue(v.publishDate))
    .sort((a,b) => new Date(a.publishDate) - new Date(b.publishDate))[0];

  // tarefas pendentes (todos os checklists)
  let pendingTasks = 0;
  state.videos.forEach(v => (v.checklist||[]).forEach(t => { if (!t.done) pendingTasks++; }));

  // ideias recentes
  const recentIdeas = [...state.ideas].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0,5);

  // conteúdos recentemente modificados
  const recentVideos = [...state.videos].sort((a,b) => new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt)).slice(0,5);

  // ===== HTML =====
  root.innerHTML = `
    <div class="dash-hero">
      <h2>Seu workspace de conteúdo</h2>
      <p>Planeje suas ideias, organize seus roteiros e acompanhe cada vídeo do conceito à publicação.</p>
    </div>

    <div class="stats-grid">
      ${statCard('Ideias totais', totalIdeas, ICONS.ideas, 'Todas as ideias cadastradas')}
      ${statCard('Em planejamento', inPlanning, ICONS.videos, 'Ideia → Roteiro')}
      ${statCard('Em produção', inProduction, ICONS.videos, 'Gravação → Revisão')}
      ${statCard('Publicados', published, ICONS.check, 'Conteúdos finalizados')}
      ${statCard('Roteiros ativos', scriptsInProgress, ICONS.scripts, 'Rascunho / desenvolvimento')}
    </div>

    <div class="panel" style="margin-bottom:20px">
      <div class="panel-head">
        <div>
          <div class="panel-title">Insights automáticos</div>
          <div class="panel-sub">Gerados a partir dos seus dados</div>
        </div>
      </div>
      <div class="panel-body" id="insights"></div>
    </div>

    <div class="panel" style="margin-bottom:20px">
      <div class="panel-head">
        <div>
          <div class="panel-title">Pipeline de conteúdo</div>
          <div class="panel-sub">Estágios pelos quais cada vídeo passa</div>
        </div>
      </div>
      <div class="pipeline" id="pipeline"></div>
    </div>

    <div class="dash-2col">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Próximo vídeo planejado</div></div>
        <div class="panel-body" id="next-video"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Vídeos atrasados</div></div>
        <div class="panel-body" id="overdue-list"></div>
      </div>
    </div>

    <div class="dash-2col">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Ideias recentes</div></div>
        <div class="panel-body" id="recent-ideas"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Conteúdos modificados recentemente</div></div>
        <div class="panel-body" id="recent-videos"></div>
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <div class="panel-head">
        <div class="panel-title">Notas rápidas</div>
        <button class="btn btn-sm btn-primary" id="new-note-dash" style="margin-left:auto">${ICONS.plus} Nova nota</button>
      </div>
      <div class="panel-body" id="dash-notes"></div>
    </div>
  `;

  // insights
  const insights = [];
  const unusedIdeas = state.ideas.filter(i => i.status === 'Nova ideia' || i.status === 'Interessante').length;
  if (unusedIdeas > 0) insights.push({type:'info', text:`Você tem <strong>${unusedIdeas}</strong> ideia(s) ainda não trabalhada(s).`});
  if (inProduction > 0) insights.push({type:'warn', text:`<strong>${inProduction}</strong> vídeo(s) em produção no momento.`});
  if (overdue.length > 0) insights.push({type:'danger', text:`<strong>${overdue.length}</strong> vídeo(s) atrasado(s). Considere revisar as datas.`});
  if (scriptsInProgress > 0) insights.push({type:'info', text:`<strong>${scriptsInProgress}</strong> roteiro(s) em desenvolvimento.`});
  if (upcoming) insights.push({type:'success', text:`Próximo conteúdo planejado para <strong>${fmtDate(upcoming.publishDate)}</strong>.`});
  if (pendingTasks > 0) insights.push({type:'warn', text:`<strong>${pendingTasks}</strong> tarefa(s) pendente(s) no total.`});
  if (insights.length === 0) insights.push({type:'success', text:'Tudo em ordem! Nada pendente no momento.'});

  $('#insights').innerHTML = insights.map(i =>
    `<div class="insight"><span class="insight-dot ${i.type}"></span><span>${i.text}</span></div>`
  ).join('');

  // pipeline
  const stages = ['Ideia','Planejamento','Roteiro','Gravacao','Edicao','Thumbnail','Revisao','Agendado','Publicado'];
  const pipe = $('#pipeline');

    ov.appendChild(emptyState({ title:'Nada atrasado', message:'Todos os seus conteúdos estão em dia.' }));

        <div style="flex:1;cursor:pointer">

  // recent videos
  const rv = $('#recent-videos');
  if (recentVideos.length === 0){
    rv.appendChild(emptyState({ title:'Sem conteúdos', message:'Converta uma ideia em vídeo.' }));
  } else {
    recentVideos.forEach(v => {

function getFilteredIdeas(){
  let list = [...state.ideas];
  const f = ideaFilters;
  if (f.search){
    const q = f.search.toLowerCase();
    list = list.filter(i =>
      (i.title||'').toLowerCase().includes(q) ||
      (i.description||'').toLowerCase().includes(q) ||
      (i.tags||'').toLowerCase().includes(q)
    );
  }
  if (f.status) list = list.filter(i => i.status === f.status);
  if (f.sort === 'recent') list.sort((a,b) => new Date(b.createdAt||0) - new Date(a.createdAt||0));
  if (f.sort === 'oldest') list.sort((a,b) => new Date(a.createdAt||0) - new Date(b.createdAt||0));
  if (f.sort === 'name') list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  if (f.sort === 'priority'){
    const rank = { urgente:0, alta:1, media:2, baixa:3 };
    list.sort((a,b) => (rank[a.priority]??2) - (rank[b.priority]??2));
  }
  return list;
}

    { render: () => {

function openTitleModal(videoId, titleId){
  const t = titleId ? state.titles.find(x => x.id === titleId) : null;
  const body = document.createElement('div');
  body.className = 'form-grid one';
  body.innerHTML = `
    <div class="form-field">
      <label>Texto do título</label>
      <input class="input" name="text" value="${esc(t?.text || '')}">
    </div>
    <div class="form-field">
      <label>Observação</label>
      <input class="input" name="note" value="${esc(t?.note || '')}">
    </div>
    <div class="form-field">
      <label>Nota pessoal (0-5)</label>
      <input class="input" type="number" name="rating" min="0" max="5" value="${t?.rating || 0}">
    </div>
    <div class="form-field">
      <label>Status</label>
      <select class="input" name="status">
        ${['Alternativa','Favorito','Escolhido','Descartado'].map(s => `<option ${t?.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
  `;
  openModal({
    title: t ? 'Editar título' : 'Novo título',
    body,
    actions: [
      { label:'Cancelar', className:'btn-ghost', onClick:(c)=>c() },
      { label:'Salvar', className:'btn-primary', onClick:(close)=>{
        const fd = new FormData(body);
        const data = {
          text: (fd.get('text')||'').trim(),
          note: (fd.get('note')||'').trim(),
          rating: +fd.get('rating') || 0,
          status: fd.get('status') || 'Alternativa'
        };
        if (!data.text){ toast('Informe o texto do título', 'error'); return; }
        if (t) Object.assign(t, data);
        else state.titles.push({ id: uid('ttl'), videoId, ...data });
        saveState();
        close();
        openVideoDrawer(videoId);
      }}
    ]
  });
}

/* ============================================================
   KANBAN
============================================================ */
function renderKanbanSection(root){
  const stages = ['Ideia','Planejamento','Roteiro','Gravacao','Edicao','Thumbnail','Revisao','Agendado','Publicado'];
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
      <div style="font-size:13px;color:var(--muted)">Arraste os cards para atualizar o status.</div>
      <button class="btn btn-primary" id="kb-new">${ICONS.plus} Novo conteúdo</button>
    </div>
  `;
  wrap.querySelector('#kb-new').onclick = () => openVideoModal();

  const board = document.createElement('div');
  board.className = 'kanban';
  board.id = 'kanban-board';

  stages.forEach(stage => {
    const col = document.createElement('div');
    col.className = 'kanban-col';
    col.dataset.stage = stage;
    const items = state.videos.filter(v => v.status === stage);
    col.innerHTML = `
      <div class="kanban-head">
        ${esc(stage)}
        <span class="count">${items.length}</span>
      </div>
    `;
    if (items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'kanban-empty';
      empty.textContent = 'Solte cards aqui';
      col.appendChild(empty);
    } else {
      items.forEach(v => {
        const card = document.createElement('div');
        card.className = 'kanban-card';
        card.draggable = true;
        card.dataset.id = v.id;
        card.innerHTML = `
          <div class="kanban-card-title">${esc(v.workTitle)}</div>
          <div class="kanban-card-meta">
            ${v.category ? `<span class="badge">${esc(v.category)}</span>` : ''}
            ${v.publishDate ? `<span>📅 ${fmtDateShort(v.publishDate)}</span>` : ''}
            ${priorityDot(v.priority)}
          </div>
          <div class="progress small"><div class="progress-bar" style="width:${progressForStatus(v.status)}%"></div></div>
          ${v.tags ? `<div style="display:flex;gap:3px;flex-wrap:wrap">${tagList(v.tags).slice(0,3).map(t => `<span class="tag" style="font-size:10px">#${esc(t)}</span>`).join('')}</div>` : ''}
        `;
        card.onclick = (e) => {
          if (e.defaultPrevented) return;
          openVideoDrawer(v.id);
        };
        card.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', v.id);
          e.dataTransfer.effectAllowed = 'move';
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        col.appendChild(card);
      });
    }

    col.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('dragover');
    });
    col.addEventListener('dragleave', e => {
      if (!col.contains(e.relatedTarget)) col.classList.remove('dragover');
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const v = state.videos.find(x => x.id === id);
      if (!v) return;
      if (v.status === stage) return;
      v.status = stage;
      v.updatedAt = new Date().toISOString();
      saveState();
      toast(`Movido para "${stage}"`, 'success');
      refresh();
    });

    board.appendChild(col);
  });

  wrap.appendChild(board);
  root.appendChild(wrap);
}
