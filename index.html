<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030a33">
<title>LIFE OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#3d7bff;--a2:#5ef0ff;--ink:#eef3ff;--mut:#8fa3dd;--ln:rgba(120,160,255,.16);--gr:#4dffa6;--rd:#ff6b86;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Manrope,system-ui,-apple-system,sans-serif;color:var(--ink);background:#030a33;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:
 radial-gradient(1000px 700px at 80% -20%,rgba(61,123,255,.35),transparent 60%),
 radial-gradient(900px 700px at -10% 110%,rgba(94,240,255,.14),transparent 60%),
 linear-gradient(180deg,#071a7a,#030a33 55%)}
#bgl{position:fixed;inset:0;z-index:-1;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .6s;pointer-events:none}
#bgl.on{opacity:.6}
#bgl:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,51,.2),rgba(3,10,51,.7))}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:grid;grid-template-columns:84px 1fr;min-height:100vh}
nav.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0;background:rgba(3,10,50,.72);border-right:1px solid var(--ln);backdrop-filter:blur(14px);z-index:30}
.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 10px 30px -8px var(--a);font-weight:800;font-size:15px;margin-bottom:10px}
.ni{position:relative;width:52px;height:52px;border-radius:17px;border:1px solid transparent;background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer;transition:.2s;flex:none}
.ni:hover{background:rgba(120,160,255,.1);color:var(--ink)}
.ni.on{color:#fff;background:linear-gradient(160deg,rgba(61,123,255,.5),rgba(20,50,170,.5));border-color:rgba(94,240,255,.45);box-shadow:0 0 22px -6px var(--a2)}
.ni.lk{opacity:.45}
.ni .sub{position:absolute;right:5px;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--a2)}
.ni .lock{position:absolute;right:4px;top:4px;width:11px;height:11px;stroke-width:2.4}
.ni .tip{position:absolute;left:70px;top:50%;transform:translateY(-50%);background:#0b1c7a;border:1px solid var(--ln);padding:6px 10px;border-radius:10px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.ni:hover .tip{opacity:1}
.scrim{position:fixed;inset:0;z-index:25}
.fly{position:fixed;left:94px;top:50%;transform:translateY(-50%);width:230px;background:linear-gradient(170deg,#0c2394,#061262);border:1px solid rgba(120,160,255,.28);border-radius:20px;padding:14px;z-index:31;box-shadow:0 30px 60px -20px #000}
.fly h4{font-size:11px;color:var(--mut);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:4px 6px 10px}
.fly button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:13px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.fly button:hover{background:rgba(120,160,255,.12)}
