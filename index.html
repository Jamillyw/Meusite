<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LIFE OS — Sistema Operacional Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   LIFE OS — CSS
   Identidade: azul profundo, glow neon, glass moderado.
   ========================================================== */
:root{
  --bg-0:#050a1c;
  --bg-1:#081130;
  --bg-2:#0b1740;
  --card:linear-gradient(160deg, rgba(37,64,158,.55), rgba(16,28,78,.75));
  --card-soft:rgba(18,30,80,.55);
  --card-border:rgba(96,140,255,.22);
  --blue:#3b82f6;
  --blue-strong:#2563eb;
  --cyan:#22d3ee;
  --violet:#8b5cf6;
  --magenta:#ec4899;
  --green:#34d399;
  --amber:#fbbf24;
  --red:#f87171;
  --text:#e9efff;
  --muted:#93a5d6;
  --faint:#5f6f9e;
  --glow-blue:0 0 24px rgba(59,130,246,.45);
  --glow-cyan:0 0 18px rgba(34,211,238,.35);
  --radius:18px;
  --sidebar-w:92px;
  --font-display:'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-body:'Inter', system-ui, -apple-system, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(900px 600px at -10% 100%, rgba(139,92,246,.12), transparent 55%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0) 70%);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{ /* textura sutil de grade */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(120,160,255,.035) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(120,160,255,.035) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 20%, #000 30%, transparent 75%);
}
::selection{background:rgba(59,130,246,.45)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(96,140,255,.25);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:18px 0;z-index:40;
  background:rgba(8,15,42,.72);backdrop-filter:blur(14px);
  border-right:1px solid rgba(96,140,255,.14);
}
.sidebar .logo{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.5px;
  background:linear-gradient(150deg,var(--blue-strong),var(--violet));
  box-shadow:var(--glow-blue);margin-bottom:14px;user-select:none;
}
.nav-item{
  width:64px;padding:9px 4px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--muted);transition:.25s;position:relative;
}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item .nl{font-size:9px;letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.nav-item:hover{color:var(--text);background:rgba(59,130,246,.14)}
.nav-item.active{color:#fff;background:linear-gradient(160deg,rgba(59,130,246,.35),rgba(139,92,246,.25));box-shadow:inset 0 0 0 1px rgba(120,160,255,.35), var(--glow-blue)}
.nav-item.locked{opacity:.45}
.nav-item .lock-dot{position:absolute;top:6px;right:8px;font-size:9px}
.sidebar .spacer{flex:1}
.avatar-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(150deg,rgba(59,130,246,.3),rgba(139,92,246,.3));
  border:1px solid var(--card-border);transition:.25s}
.avatar-btn:hover{box-shadow:var(--glow-blue)}

.main{flex:1;margin-left:var(--sidebar-w);padding:26px 30px 90px;max-width:1240px;width:100%}
.bottom-nav{display:none}

/* ---------- Header ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-family:var(--font-display);font-size:clamp(22px,3.2vw,30px);font-weight:700;letter-spacing:-.3px}
.topbar .date{color:var(--muted);font-size:13px;margin-top:4px;text-transform:capitalize}
.topbar .right{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  background:var(--card-soft);border:1px solid var(--card-border);font-size:12.5px;font-weight:600}
.pill b{color:var(--cyan);font-family:var(--font-display)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

/* ---------- Cards ---------- */
.grid{display:grid;gap:16px}
.card{
  position:relative;border-radius:var(--radius);padding:20px 22px;
  background:var(--card);border:1px solid var(--card-border);
  backdrop-filter:blur(10px);
  box-shadow:0 12px 32px rgba(2,6,24,.45);
  animation:cardIn .5s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card .label{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.card h3{font-family:var(--font-display);font-size:17px;font-weight:600}
.card .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:6px}
.card.glow{box-shadow:0 12px 32px rgba(2,6,24,.45), var(--glow-blue)}
.card.locked-card{opacity:.75;border-style:dashed}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.09s}
.stagger>*:nth-child(3){animation-delay:.15s}.stagger>*:nth-child(4){animation-delay:.21s}
.stagger>*:nth-child(5){animation-delay:.27s}.stagger>*:nth-child(6){animation-delay:.33s}

/* ---------- Barras / anel de progresso ---------- */
.bar{height:8px;border-radius:99px;background:rgba(10,18,52,.85);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--blue-strong),var(--cyan));
  box-shadow:0 0 12px rgba(34,211,238,.55);transition:width .7s cubic-bezier(.22,1,.36,1)}
.ring{width:120px;height:120px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .track{stroke:rgba(96,140,255,.15)}
.ring .fill{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1);filter:drop-shadow(0 0 6px rgba(34,211,238,.6))}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .center b{font-family:var(--font-display);font-size:26px}
.ring .center span{display:block;font-size:9px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.4px;
  transition:transform .18s, box-shadow .25s, background .25s;user-select:none}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,var(--blue-strong),#1d4ed8);color:#fff;box-shadow:0 6px 20px rgba(37,99,235,.4)}
.btn-primary:hover{box-shadow:0 6px 26px rgba(37,99,235,.65), var(--glow-cyan)}
.btn-ghost{background:rgba(59,130,246,.12);border:1px solid rgba(96,140,255,.3);color:var(--text)}
.btn-ghost:hover{background:rgba(59,130,246,.22)}
.btn-soft{background:rgba(148,163,216,.1);color:var(--muted);border:1px solid transparent}
.btn-soft:hover{color:var(--text);background:rgba(148,163,216,.18)}
.btn-sm{padding:7px 13px;font-size:11.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-danger{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35);color:var(--red)}

/* ---------- Microações ---------- */
.micro-list{display:flex;flex-direction:column;gap:12px}
.micro{
  display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;
  background:rgba(10,20,60,.55);border:1px solid rgba(96,140,255,.16);
  transition:.3s;position:relative;overflow:hidden;
}
.micro.next{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 1px rgba(34,211,238,.25), var(--glow-cyan)}
.micro.next::before{content:"SUA PRÓXIMA AÇÃO";position:absolute;top:0;right:0;
  font-size:8px;letter-spacing:1.5px;font-weight:800;color:#062033;
  background:linear-gradient(90deg,var(--cyan),#7ee8fa);padding:3px 10px;border-radius:0 0 0 10px}
.micro.done{opacity:.55;border-color:rgba(52,211,153,.35)}
.micro.done .m-name{text-decoration:line-through;text-decoration-color:rgba(52,211,153,.6)}
.micro.postponed{border-style:dashed;opacity:.7}
.micro .m-time{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--cyan);width:48px;flex:none}
.micro .m-body{flex:1;min-width:0}
.micro .m-name{font-weight:600;font-size:14.5px}
.micro .m-meta{font-size:11px;color:var(--muted);margin-top:2px}
.micro .m-actions{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.check{width:26px;height:26px;border-radius:50%;border:2px solid rgba(52,211,153,.6);display:grid;place-items:center;color:var(--green);font-size:13px;flex:none}
.micro-timer{font-family:var(--font-display);font-size:12px;color:var(--amber);margin-top:4px}

/* ---------- Árvore de evolução ---------- */
.tree{position:relative;padding:10px 0 30px}
.tree::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(96,140,255,.05),rgba(96,140,255,.4),rgba(96,140,255,.05))}
.tnode{position:relative;width:min(340px,44%);padding:14px 18px;border-radius:16px;margin:14px 0;
  background:rgba(10,20,60,.6);border:1px solid rgba(96,140,255,.18)}
.tnode:nth-child(odd){margin-left:auto;margin-right:calc(50% + 26px)}
.tnode:nth-child(even){margin-right:auto;margin-left:calc(50% + 26px)}
.tnode .t-tag{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tnode .t-name{font-family:var(--font-display);font-weight:600;font-size:15px;margin-top:3px}
.tnode .t-req{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.tnode .t-state{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;transform:translateY(-50%);background:var(--bg-2);border:1px solid var(--card-border)}
.tnode:nth-child(odd) .t-state{right:-44px}
.tnode:nth-child(even) .t-state{left:-44px}
.tnode.done{border-color:rgba(52,211,153,.4)}
.tnode.done .t-state{background:rgba(52,211,153,.15);color:var(--green);border-color:rgba(52,211,153,.5)}
.tnode.current{border-color:rgba(34,211,238,.6);box-shadow:var(--glow-cyan)}
.tnode.current .t-state{background:rgba(34,211,238,.15);color:var(--cyan);border-color:var(--cyan);animation:pulse 2.2s infinite}
.tnode.locked{opacity:.6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.45)}50%{box-shadow:0 0 0 9px rgba(34,211,238,0)}}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.input,select.input,textarea.input{
  width:100%;padding:11px 14px;border-radius:12px;font-size:14px;
  background:rgba(6,12,38,.8);border:1px solid rgba(96,140,255,.25);outline:none;transition:.25s}
.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
textarea.input{resize:vertical;min-height:90px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}

/* ---------- Listas genéricas ---------- */
.line-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;
  background:rgba(10,20,60,.5);border:1px solid rgba(96,140,255,.14);margin-bottom:9px}
.line-item .li-body{flex:1;min-width:0}
.line-item .li-title{font-weight:600;font-size:13.5px}
.line-item .li-sub{font-size:11px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.5px;
  background:rgba(59,130,246,.18);border:1px solid rgba(96,140,255,.3);color:#bfd2ff}
.badge.green{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:#9ff0d2}
.badge.pink{background:rgba(236,72,153,.14);border-color:rgba(236,72,153,.4);color:#ffc2de}
.badge.amber{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4);color:#ffe1a1}
.empty{padding:26px;text-align:center;color:var(--faint);font-size:13px;border:1px dashed rgba(96,140,255,.2);border-radius:14px}

/* ---------- Rotina (grade semanal) ---------- */
.week{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;min-width:760px}
.week .hcell{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 0;font-weight:700}
.week .hcell.today{color:var(--cyan)}
.week .tcell{font-size:9.5px;color:var(--faint);text-align:right;padding-right:6px;height:34px;line-height:34px}
.week .cell{height:34px;border-radius:6px;background:rgba(10,20,60,.35);border:1px solid rgba(96,140,255,.07);position:relative}
.week .block{position:absolute;left:2px;right:2px;border-radius:8px;padding:4px 7px;font-size:10px;font-weight:600;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:2;box-shadow:0 2px 10px rgba(2,6,24,.5)}
.week-scroll{overflow-x:auto;padding-bottom:8px}

/* ---------- Calendário ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .ch{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.cal .cd{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13px;background:rgba(10,20,60,.5);border:1px solid rgba(96,140,255,.12);cursor:pointer;transition:.2s;position:relative}
.cal .cd:hover{border-color:var(--cyan)}
.cal .cd.sel{border-color:var(--cyan);box-shadow:var(--glow-cyan)}
.cal .cd.active-day{background:rgba(59,130,246,.2)}
.cal .cd.consistent{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.35)}
.cal .cd .dd{width:5px;height:5px;border-radius:50%;background:var(--amber)}

/* ---------- Alter ego ---------- */
.versus{display:flex;align-items:center;gap:16px}
.versus .ego{flex:1;text-align:center;padding:18px 10px;border-radius:16px;background:rgba(10,20,60,.55);border:1px solid rgba(96,140,255,.18)}
.versus .ego .e-name{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.5px}
.versus .ego .e-pct{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:6px}
.versus .vs{font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:13px}
.duel-bar{height:12px;border-radius:99px;overflow:hidden;display:flex;margin-top:16px;background:rgba(10,18,52,.9)}
.duel-bar .d-disc{background:linear-gradient(90deg,var(--blue-strong),var(--cyan));transition:width .8s}
.duel-bar .d-imp{background:linear-gradient(90deg,var(--magenta),#f472b6);transition:width .8s}

/* ---------- Toasts / overlays ---------- */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;
  background:rgba(12,22,64,.92);border:1px solid rgba(96,140,255,.4);backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(2,6,24,.6);animation:toastIn .35s cubic-bezier(.22,1,.36,1)}
.toast.xp{border-color:rgba(34,211,238,.5);color:#c9f6ff}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .4s forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

.overlay{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;
  background:rgba(3,7,22,.82);backdrop-filter:blur(12px);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay .panel{width:min(480px,100%);border-radius:22px;padding:32px 28px;text-align:center;
  background:linear-gradient(165deg,rgba(30,52,130,.9),rgba(10,18,58,.95));
  border:1px solid rgba(120,160,255,.35);box-shadow:0 30px 80px rgba(2,6,24,.8), var(--glow-blue);
  animation:panelIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.overlay h2{font-family:var(--font-display);font-size:24px;margin-bottom:8px}
.overlay p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:18px}

#unlock-overlay .panel{border-color:rgba(34,211,238,.6);box-shadow:0 0 60px rgba(34,211,238,.35)}
.unlock-title{font-family:var(--font-display);font-size:13px;letter-spacing:5px;color:var(--cyan);font-weight:700;margin-bottom:10px}
.unlock-name{font-family:var(--font-display);font-size:30px;font-weight:700;margin-bottom:10px}
.unlock-rays{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 20deg,rgba(34,211,238,.07) 20deg 40deg,transparent 40deg 60deg,rgba(34,211,238,.07) 60deg 80deg,transparent 80deg 100deg,rgba(34,211,238,.07) 100deg 120deg,transparent 120deg 140deg,rgba(34,211,238,.07) 140deg 160deg,transparent 160deg 180deg,rgba(34,211,238,.07) 180deg 200deg,transparent 200deg 220deg,rgba(34,211,238,.07) 220deg 240deg,transparent 240deg 260deg,rgba(34,211,238,.07) 260deg 280deg,transparent 280deg 300deg,rgba(34,211,238,.07) 300deg 320deg,transparent 320deg 340deg,rgba(34,211,238,.07) 340deg 360deg);animation:spin 14s linear infinite;pointer-events:none;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modo Calmo (baixa estimulação) ---------- */
body.calm *{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.1s !important}
body.calm{--glow-blue:none;--glow-cyan:none}
body.calm .card{box-shadow:0 8px 22px rgba(2,6,24,.4)}
body.calm .unlock-rays{display:none}
body.calm::before{display:none}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.1s !important}
}

/* ---------- Responsivo ---------- */
@media (max-width:900px){
  .sidebar{display:none}
  .main{margin-left:0;padding:18px 16px 110px}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:rgba(8,15,42,.9);backdrop-filter:blur(16px);
    border-top:1px solid rgba(96,140,255,.16);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;
  }
  .bottom-nav .nav-item{width:auto;flex:1;padding:7px 2px;border-radius:12px}
  .tree::before{left:16px}
  .tnode,.tnode:nth-child(odd),.tnode:nth-child(even){width:auto;margin:12px 0 12px 44px}
  .tnode:nth-child(odd) .t-state,.tnode:nth-child(even) .t-state{left:-40px;right:auto;width:30px;height:30px;font-size:12px}
  .ring{width:100px;height:100px}
  .micro{flex-wrap:wrap}
  .micro .m-actions{width:100%;justify-content:flex-start}
}
</style>
<style>
/* ============ v2: sidebar compacta, páginas bloqueadas, novos módulos ============ */
:root{--sidebar-w:84px}
.sidebar{width:var(--sidebar-w);padding:12px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.sidebar .logo{width:38px;height:38px;font-size:13px;border-radius:12px;margin-bottom:8px;flex:none}
.nav-item{width:62px;padding:6px 2px;gap:2px;border-radius:11px;flex:none}
.nav-item svg{width:17px;height:17px}
.nav-item .nl{font-size:7.5px;letter-spacing:.4px}
.nav-item .lock-dot{top:3px;right:6px;font-size:8px}
.avatar-btn{width:38px;height:38px;font-size:16px;overflow:hidden;flex:none}
.avatar-btn img{width:100%;height:100%;object-fit:cover}

/* página real por trás do cadeado */
.locked-preview{opacity:.26;filter:saturate(.35) blur(1.5px);pointer-events:none;user-select:none}
.lock-fixed{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;padding:20px}
.lock-fixed .lock-panel{pointer-events:auto;width:min(440px,100%);text-align:center;border-radius:22px;padding:30px 26px;
  background:linear-gradient(165deg,rgba(20,34,92,.96),rgba(8,14,44,.97));
  border:1px solid rgba(120,160,255,.4);box-shadow:0 30px 80px rgba(2,6,24,.85), var(--glow-blue);
  animation:panelIn .4s cubic-bezier(.22,1,.36,1)}

/* menu mobile em grade */
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.menu-grid .nav-item{width:100%;padding:12px 4px;background:rgba(10,20,60,.5);border:1px solid rgba(96,140,255,.15)}
.menu-grid .nav-item .nl{font-size:9px}

/* estrelas de avaliação */
.stars{display:inline-flex;gap:2px}
.stars span{cursor:pointer;font-size:17px;color:var(--faint);transition:.15s;line-height:1}
.stars span.on{color:var(--amber);text-shadow:0 0 8px rgba(251,191,36,.5)}
.stars span:hover{transform:scale(1.2)}

/* filtros / tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs .tab{padding:7px 14px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--muted);
  background:rgba(10,20,60,.5);border:1px solid rgba(96,140,255,.15);transition:.2s}
.tabs .tab.active{color:#fff;background:linear-gradient(135deg,rgba(59,130,246,.4),rgba(139,92,246,.3));border-color:rgba(120,160,255,.45)}

/* kanban do canal */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;min-width:920px}
.kcol{background:rgba(8,16,48,.5);border:1px solid rgba(96,140,255,.12);border-radius:14px;padding:10px;min-height:120px}
.kcol .khead{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px;text-align:center}
.kcard{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.2s}
.kcard:hover{border-color:rgba(34,211,238,.5);transform:translateY(-2px)}
.kcard .kt{font-weight:600;font-size:12.5px;line-height:1.3}
.kcard .km{display:flex;gap:4px;margin-top:8px;justify-content:space-between}
.kcard .km button{font-size:11px;color:var(--muted);padding:2px 7px;border-radius:7px;background:rgba(96,140,255,.12)}
.kcard .km button:hover{color:#fff;background:rgba(96,140,255,.3)}

/* conquistas */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.ach{border-radius:15px;padding:15px 13px;text-align:center;background:rgba(10,20,60,.55);border:1px solid rgba(96,140,255,.16);transition:.25s}
.ach .a-icon{font-size:26px;display:block;margin-bottom:7px}
.ach .a-name{font-weight:700;font-size:12.5px;font-family:var(--font-display)}
.ach .a-desc{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.ach.won{border-color:rgba(251,191,36,.5);background:linear-gradient(160deg,rgba(251,191,36,.1),rgba(10,20,60,.6));box-shadow:0 0 18px rgba(251,191,36,.15)}
.ach.locked{opacity:.42}
.ach.locked .a-icon{filter:grayscale(1)}

/* imagens de ego / rank */
.ego-img{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;overflow:hidden;display:grid;place-items:center;
  font-size:30px;background:rgba(10,20,60,.7);border:2px solid rgba(96,140,255,.3)}
.ego-img img{width:100%;height:100%;object-fit:cover}
.t-state img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.img-slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(10,20,60,.5);border:1px solid rgba(96,140,255,.14);margin-bottom:8px}
.img-slot .prev{width:44px;height:44px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:20px;background:rgba(6,12,38,.8);flex:none}
.img-slot .prev img{width:100%;height:100%;object-fit:cover}
.img-slot .prev.round{border-radius:50%}
</style>

/* ---------- Datas com "virada de dia" configurável ---------- */
function nowMinusRollover(){
  const d = new Date();
  d.setHours(d.getHours() - CFG.dayRolloverHour);
  return d;
}
function todayKey(){
  const d = nowMinusRollover();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function keyToDate(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y, m-1, d); }
function addDaysKey(k, n){ const d = keyToDate(k); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function diffDays(a, b){ return Math.round((keyToDate(b) - keyToDate(a)) / 86400000); }
function weekKey(){ // chave da semana (segunda-feira)
  const d = nowMinusRollover(); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateLong(){
  return nowMinusRollover().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
}
function greeting(){
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'Bom dia';
  if (h >= 12 && h < 18) return 'Boa tarde';
  return 'Boa noite';
}

/* ==========================================================
   36. loadState / saveState / initializeApp
   ========================================================== */
function defaultState(){
  return {
    user: { name:'', title:'', avatar:'🌱' },
    xp: 0,
    activeDays: 0,
    consistentDays: 0,
    recoveryCount: 0,
    currentStreak: 0,
    longestStreak: 0,
    lastActiveDate: null,
    class: null,
    calm: false,
    today: null,            // { date, micros:{id:{started,done,postponed}}, xpEarned }
    dayLog: {},             // dateKey -> { active, consistent, microsDone, xp }
    unlockedFeatures: [],
    unlockedCapabilities: [],
    completedQuests: {},    // 'daily:dateKey' / 'weekly:weekKey:id' -> true
    extraActions: [],       // microações extras (4ª em diante)
    habits: [],             // {id,name,createdAt,checks:{dateKey:true}}
    studies: [],            // {id,subject,minutes,date}
    workouts: { fichas: [], log: [] }, // ficha:{id,name,exercises:[{name,sets,reps,load}]}
    projects: [],           // {id,name,steps:[{text,done}],createdAt}
    diary: {},              // dateKey -> text
    finance: [],            // {id,desc,value,type:'in'|'out',cat,date}
    routineBlocks: [],      // {id,day:0-6(seg-dom),start:'08:00',end:'09:00',title,cat}
    inbox: [],              // {id,text,date,done}
    energy: {},             // dateKey -> 1..5
    hobbies: [],            // {id,name,target,log:{dateKey:true}}
    media: [],              // {id,type:'livro'|'filme'|'série'|'anime',title,status,rating,note}
    videos: [],             // {id,title,status,hook,script,tags,createdAt}
    stats: { micros:0, workouts:0, studies:0, diary:0, hobbies:0, missions:0 },
    images: {},             // {avatar, egoD, egoI, rank1..rank8} -> dataURL
    achievements: [],       // ids conquistados
    returnMission: null,    // {dayIndex, progress}
    ego: { discipline:0, impulse:0 },
    history: []             // [{date, text}]
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(CFG.storageKey);
    if (!raw) return null;
    const s = JSON.parse(raw);
    return Object.assign(defaultState(), s);
  } catch(e){ console.warn('Save corrompido, reiniciando.', e); return null; }
}
function saveState(){
  try { localStorage.setItem(CFG.storageKey, JSON.stringify(state)); }
  catch(e){ console.warn('Falha ao salvar.', e); }
}
function logHistory(text){
  state.history.unshift({ date: todayKey(), text });
  if (state.history.length > 120) state.history.length = 120;
}

/* ==========================================================
   DIAS ATIVOS / CONSISTENTES / STREAK / RECUPERAÇÃO
   ========================================================== */
function ensureToday(){
  const tk = todayKey();
  if (state.today && state.today.date === tk) return;

  // fecha o dia anterior (se existir): microação iniciada e não concluída = impulso +1
  if (state.today){
    const prev = state.today;
    const microIds = allMicroActions().map(m=>m.id);
    let doneCount = 0;
    microIds.forEach(id=>{
      const m = prev.micros[id];
      if (m && m.done) doneCount++;
      else if (m && m.started && !m.done) state.ego.impulse += 1;
    });
    const consistent = doneCount >= Math.min(3, microIds.length) && microIds.slice(0,3).every(id=>prev.micros[id] && prev.micros[id].done);
    const active = doneCount > 0 || prev.xpEarned > 0;
    state.dayLog[prev.date] = Object.assign(state.dayLog[prev.date]||{}, {
      active, consistent, microsDone: doneCount, xp: prev.xpEarned
    });
    if (active && !prev.countedActive){ state.activeDays++; prev.countedActive = true; }
    if (consistent && !prev.countedConsistent){ state.consistentDays++; prev.countedConsistent = true; }
  }

  state.today = { date: tk, micros:{}, xpEarned:0, countedActive:false, countedConsistent:false };
  saveState();
}

function registerActiveDay(){
  ensureToday();
  // streak
  if (state.lastActiveDate !== state.today.date){
    const gap = state.lastActiveDate ? diffDays(state.lastActiveDate, state.today.date) : null;
    if (gap === 1) state.currentStreak++;
    else state.currentStreak = 1;
    state.longestStreak = Math.max(state.longestStreak, state.currentStreak);
    state.lastActiveDate = state.today.date;
    if (!state.today.countedActive){ state.activeDays++; state.today.countedActive = true; }
  }
}
function registerConsistentDay(){
  if (!state.today.countedConsistent){
    state.consistentDays++;
    state.today.countedConsistent = true;
  }
}

/* Retorno após ausência: nunca punir — celebrar a volta */
function checkReturn(){
  if (!state.lastActiveDate) return;
  const gap = diffDays(state.lastActiveDate, todayKey());
  if (gap >= 2 && !state.today.returnBonusGiven){
    state.today.returnBonusGiven = true;
    state.recoveryCount++;
    addXP(CFG.xpRewards.returnBonus, 'Bônus de retorno');
    toast(`💙 ${CFG.messages.welcomeBack} +${CFG.xpRewards.returnBonus} XP`, 'xp');
    logHistory(`Retorno após ${gap} dias — bônus de retorno`);
  }
  // Missão de retorno: rampa suave de 3 dias após ausência maior
  if (gap >= CFG.returnMission.minGap && !state.returnMission){
    state.returnMission = { dayIndex:0, progress:0 };
    logHistory('Missão de retorno ativada');
  }
}

/* Missão de retorno: avança a cada microação concluída */
function progressReturnMission(){
  const rm = state.returnMission;
  if (!rm) return;
  rm.progress++;
  const goal = CFG.returnMission.goals[rm.dayIndex];
  if (rm.progress >= goal){
    const reward = CFG.returnMission.rewards[rm.dayIndex];
    const dayNum = rm.dayIndex + 1;
    rm.dayIndex++; rm.progress = 0;
    addXP(reward, `Missão de retorno — dia ${dayNum} concluído`, 'quest');
    if (rm.dayIndex >= CFG.returnMission.goals.length){
      state.returnMission = null;
      state.stats.missions++;
      showUnlockAnimation('MISSÃO DE RETORNO', 'Concluída 🛡️', 'Você reconstruiu o ritmo em 3 dias. Voltar é uma habilidade — e você domina.');
      logHistory('Missão de retorno concluída');
      checkAchievements();
    }
  }
}

/* Conquistas automáticas */
function checkAchievements(){
  let changed = false;
  for (const a of ACHIEVEMENTS){
    if (!state.achievements.includes(a.id) && a.check(state)){
      state.achievements.push(a.id);
      showUnlockAnimation('CONQUISTA DESBLOQUEADA', `${a.icon} ${a.name}`, a.desc);
      logHistory(`Conquista: ${a.name}`);
      changed = true;
    }
  }
  if (changed) saveState();
}

/* ==========================================================
   XP / RANK / CLASSE
   ========================================================== */
function classBonus(kind, base){
  if (!state.class) return base;
  const c = state.class;
  if (c === 'foco'         && kind==='micro')   return base + 5;
  if (c === 'atleta'       && kind==='workout') return base + 20;
  if (c === 'criadora'     && (kind==='diary'||kind==='project')) return base + 10;
  return base;
}
function addXP(amount, reason, kind){
  if (amount <= 0) return;
  state.xp += amount;
  state.today.xpEarned += amount;
  if (reason) toast(`+${amount} XP · ${reason}`, 'xp');
  const before = currentRank().level;
  saveState();
  const after = currentRank().level;
  if (after > before){
    const r = CFG.ranks[after-1];
    showUnlockAnimation(`RANK ${after}`, r.name, r.desc);
    logHistory(`Subiu para o Rank ${after} — ${r.name}`);
  }
  checkUnlocks();
}
function currentRank(){
  let r = CFG.ranks[0];
  for (const rank of CFG.ranks){
    if (meetsReq(rank.req)) r = rank; else break;
  }
  return r;
}
function nextRank(){
  const cur = currentRank().level;
  return CFG.ranks[cur] || null; // ranks[cur] = próximo (array 0-index)
}
function complexityLevel(){ return Math.min(currentRank().level, CFG.complexityLevels.length); }
function maxDailyActions(){ return CFG.complexityLevels[complexityLevel()-1].maxDailyActions; }

/* ==========================================================
   22. SISTEMA DE REQUISITOS / DESBLOQUEIOS
   ========================================================== */
function meetsReq(req){
  if (!req) return true;
  if (req.xp            != null && state.xp            < req.xp)            return false;
  if (req.activeDays    != null && state.activeDays    < req.activeDays)    return false;
  if (req.consistentDays!= null && state.consistentDays< req.consistentDays)return false;
  if (req.rank          != null && currentRank().level < req.rank)          return false;
  return true;
}
function reqProgress(req){ // retorna [{label, ok, cur, target}]
  const out = [];
  if (!req) return out;
  if (req.xp != null)             out.push({ label:`${req.xp} XP`, cur:state.xp, target:req.xp, ok:state.xp>=req.xp });
  if (req.activeDays != null)     out.push({ label:`${req.activeDays} dias ativos`, cur:state.activeDays, target:req.activeDays, ok:state.activeDays>=req.activeDays });
  if (req.consistentDays != null) out.push({ label:`${req.consistentDays} dias consistentes`, cur:state.consistentDays, target:req.consistentDays, ok:state.consistentDays>=req.consistentDays });
  if (req.rank != null)           out.push({ label:`Rank ${req.rank}`, cur:currentRank().level, target:req.rank, ok:currentRank().level>=req.rank });
  return out;
}
function reqText(req){
  return reqProgress(req).map(p => `${p.ok?'✓':'○'} ${p.label}`).join(' · ');
}
function isFeatureUnlocked(id){
  return state.unlockedFeatures.includes(id);
}
function checkUnlocks(){
  let changed = false;
  for (const f of CFG.features){
    if (!state.unlockedFeatures.includes(f.id) && meetsReq(f.req)){
      state.unlockedFeatures.push(f.id);
      showUnlockAnimation('NOVO SISTEMA DISPONÍVEL', f.name, f.desc);
      logHistory(`Sistema desbloqueado: ${f.name}`);
      changed = true;
    }
  }
  for (const c of CFG.capabilities){
    if (!state.unlockedCapabilities.includes(c.id) && meetsReq(c.req)){
      state.unlockedCapabilities.push(c.id);
      if (!c.id.startsWith('micro_')) showUnlockAnimation('NOVA CAPACIDADE', c.name, '');
      logHistory(`Capacidade desbloqueada: ${c.name}`);
      changed = true;
    }
  }
  checkAchievements();
  if (changed) saveState();
}
/* duração atual da microação principal (maior nível cujo req é satisfeito) */
function currentMicroMinutes(){
  let m = CFG.microActionLevels[0].minutes;
  for (const lvl of CFG.microActionLevels){ if (meetsReq(lvl.req)) m = lvl.minutes; else break; }
  return m;
}
function nextMicroLevel(){
  const cur = currentMicroMinutes();
  return CFG.microActionLevels.find(l => l.minutes > cur) || null;
}
/* próximo desbloqueio (o mais "barato" ainda fechado) */
function nextUnlock(){
  const candidates = [];
  const ml = nextMicroLevel();
  if (ml) candidates.push({ name:`Microação de ${ml.minutes} min`, req:ml.req, type:'cap' });
  for (const f of CFG.features) if (!isFeatureUnlocked(f.id)) candidates.push({ name:f.name, req:f.req, type:'feature', desc:f.desc });
  const nr = nextRank();
  if (nr) candidates.push({ name:`Rank ${nr.level} — ${nr.name}`, req:nr.req, type:'rank' });
  if (!candidates.length) return null;
  // ordena pelo maior requisito de XP (menor primeiro)
  candidates.sort((a,b)=>((a.req&&a.req.xp)||0)-((b.req&&b.req.xp)||0));
  return candidates[0];
}
</script>
<script>
/* ==========================================================
   MICROAÇÕES — mecânica central
   ========================================================== */
function allMicroActions(){
  const base = CFG.microActions.map(m => ({...m}));
  const focusMin = currentMicroMinutes();
  base.forEach(m => { if (m.timed) m.durationMin = focusMin; });
  return base.concat(state.extraActions.map(a => ({...a, extra:true})));
}
function microState(id){
  ensureToday();
  if (!state.today.micros[id]) state.today.micros[id] = { started:false, done:false, postponed:false };
  return state.today.micros[id];
}
function nextPendingMicro(){
  const list = allMicroActions();
  return list.find(m => { const s = microState(m.id); return !s.done && !s.postponed; })
      || list.find(m => !microState(m.id).done) || null;
}

function startMicro(id){
  const s = microState(id);
  if (s.done) return;
  const action = allMicroActions().find(m=>m.id===id);
  if (!s.started){
    s.started = true;
    registerActiveDay();
    state.ego.discipline += 1;
    addXP(CFG.xpRewards.startMicro, 'Começou — isso conta', 'start');
    saveState();
  }
  // timer visível (anti-cegueira-temporal): um por vez
  stopActiveTimer(false);
  const mins = action.durationMin || 5;
  activeTimer = { microId:id, endsAt: Date.now() + mins*60000, intervalId:null };
  activeTimer.intervalId = setInterval(tickTimer, 1000);
  renderMain();
}
function stopActiveTimer(finished){
  if (!activeTimer) return;
  clearInterval(activeTimer.intervalId);
  if (finished === true){
    toast('⏱ Tempo concluído. Pode marcar como feita — sem pressa.');
  }
  activeTimer = null;
}
function tickTimer(){
  if (!activeTimer) return;
  const left = activeTimer.endsAt - Date.now();
  const el = $('#timer-'+activeTimer.microId);
  if (left <= 0){
    if (el) el.textContent = 'tempo concluído ✓';
    stopActiveTimer(true);
    return;
  }
  const mm = Math.floor(left/60000), ss = Math.floor((left%60000)/1000);
  if (el) el.textContent = `⏱ ${mm}:${String(ss).padStart(2,'0')} restantes`;
}
function completeMicro(id){
  const s = microState(id);
  if (s.done) return;
  s.done = true; s.postponed = false;
  if (activeTimer && activeTimer.microId === id) stopActiveTimer(false);
  registerActiveDay();
  state.ego.discipline += 2;
  state.stats.micros++;
  const action = allMicroActions().find(m=>m.id===id);
  let xp = classBonus('micro', CFG.xpRewards.completeMicro);
  addXP(xp, action ? action.name : 'Microação', 'micro');
  progressReturnMission();
  checkAllThree();
  saveState(); renderMain();
}
function postponeMicro(id){
  const s = microState(id);
  if (s.done) return;
  s.postponed = true;
  state.ego.impulse += 1;
  toast('Adiada para depois — sem culpa. Ela fica aqui te esperando.');
  saveState(); renderMain();
}
function checkAllThree(){
  const core = CFG.microActions.slice(0,3);
  const allDone = core.every(m => microState(m.id).done);
  if (allDone && !state.today.allThreeBonusGiven){
    state.today.allThreeBonusGiven = true;
    registerConsistentDay();
    let bonus = CFG.xpRewards.allThreeBonus;
    if (state.class === 'disciplina') bonus += 25;
    addXP(bonus, 'As 3 microações completas', 'bonus');
    completeQuest('daily:'+todayKey(), CFG.quests.daily.xp, CFG.quests.daily.name);
    toast('✨ Dia consistente registrado.');
  }
}
function addExtraAction(){
  const name = $('#extra-name') ? $('#extra-name').value.trim() : '';
  const time = $('#extra-time') ? $('#extra-time').value : '12:00';
  if (!name){ toast('Dê um nome à ação.'); return; }
  if (allMicroActions().length >= maxDailyActions()){ toast('Limite de ações do seu nível de complexidade atingido.'); return; }
  state.extraActions.push({ id:'x'+Date.now(), time, name, durationMin: currentMicroMinutes(), timed:true });
  logHistory(`Nova ação diária: ${name}`);
  saveState(); renderMain();
}

/* ==========================================================
   QUESTS
   ========================================================== */
function completeQuest(key, xp, name){
  if (state.completedQuests[key]) return;
  state.completedQuests[key] = true;
  addXP(xp, `Quest: ${name}`, 'quest');
}
function weeklyStats(){
  const wk = weekKey();
  let days=0, micros=0, consist=0;
  for (let i=0;i<7;i++){
    const k = addDaysKey(wk, i);
    const d = state.dayLog[k];
    const isToday = (k === todayKey());
    const active = d ? d.active : (isToday && state.today.countedActive);
    const mc = d ? (d.microsDone||0) : (isToday ? Object.values(state.today.micros).filter(m=>m.done).length : 0);
    const cs = d ? d.consistent : (isToday && state.today.allThreeBonusGiven);
    if (active) days++;
    micros += mc;
    if (cs) consist++;
  }
  return { days, micros, consist };
}

/* ==========================================================
   TOASTS + ANIMAÇÃO DE DESBLOQUEIO
   ========================================================== */
function toast(msg, type){
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 400); }, 3400);
}
function showUnlockAnimation(kicker, name, desc){
  const root = $('#overlay-root');
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'unlock-overlay';
  ov.innerHTML = `
    <div class="panel" style="position:relative;overflow:hidden">
      <div class="unlock-rays"></div>
      <div class="unlock-title">UNLOCKED</div>
      <div style="font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:6px">${esc(kicker)}</div>
      <div class="unlock-name">${esc(name)}</div>
      ${desc ? `<p>${esc(desc)}</p>` : '<p></p>'}
      <button class="btn btn-primary" onclick="this.closest('.overlay').remove(); renderMain();">Continuar</button>
    </div>`;
  root.appendChild(ov);
  // auto-fecha sem re-renderizar (para não apagar nada que a pessoa esteja digitando)
  setTimeout(()=>{ if (ov.parentNode) ov.remove(); }, 6000);
}

/* ==========================================================
   NAVEGAÇÃO
   ========================================================== */
const NAV = [
  { page:'home',      label:'Início',    icon:'home' },

];
const NAV_MORE = [

function allNav(){ return NAV.concat(NAV_MORE); }

      <span class="nl">Menu</span>

function openMobileMenu(){

      ${allNav().map(n=>{
        const locked = n.feature && !isFeatureUnlocked(n.feature);

          ${icon(n.icon)}<span class="nl">${esc(n.label)}</span>${locked?'<span class="lock-dot">🔒</span>':''}
        </button>`;
      }).join('')}

<script>
/* ==========================================================
   RENDER PRINCIPAL
   ========================================================== */
function renderAll(){
  renderNav();
  renderMain();
}
function renderMain(){
  const main = $('#main');
  const PAGES = {
    home: pageHome, evo: pageEvo, quests: pageQuests, config: pageConfig,
    habitos: pageHabitos, estudos: pageEstudos, treinos: pageTreinos,
    projetos: pageProjetos, rotina: pageRotina, calendario: pageCalendario,
    diario: pageDiario, alterego: pageAlterEgo, financas: pageFinancas,
    inbox: pageInbox, lab: pageLab, conquistas: pageConquistas,
    hobbies: pageHobbies, midia: pageMidia, youtube: pageYoutube
  };
  const navItem = allNav().find(n=>n.page===currentPage);
  const pageFn = PAGES[currentPage] || pageHome;
  if (navItem && navItem.feature && !isFeatureUnlocked(navItem.feature)){
    const f = CFG.features.find(f=>f.id===navItem.feature);
    // mostra a página REAL por trás (com opacidade/blur) + painel de cadeado por cima
    main.innerHTML = `<div class="locked-preview" inert></div>`;
    pageFn($('.locked-preview', main));
    const reqs = reqProgress(f.req).map(p =>
      `<span class="badge ${p.ok?'green':''}" style="margin:3px">${p.ok?'✓':'○'} ${esc(p.label)}${p.target?' · '+Math.min(p.cur,p.target)+'/'+p.target:''}</span>`
    ).join('');
    const lockEl = document.createElement('div');
    lockEl.className = 'lock-fixed';
    lockEl.innerHTML = `
      <div class="lock-panel">
        <div style="font-size:38px;margin-bottom:12px">🔒</div>
        <h3 style="font-size:21px;font-family:var(--font-display)">${esc(f.name)}</h3>
        <p style="color:var(--muted);font-size:13px;line-height:1.6;margin:10px 0 14px">${CFG.messages.lockedTitle}<br>${CFG.messages.lockedBody}</p>
        <div>${reqs}</div>
        <p style="color:var(--faint);font-size:12px;margin-top:14px">${esc(f.desc)}</p>
      </div>`;
    main.appendChild(lockEl);
    return;
  }
  pageFn(main);
}

/* ---------- Anel de progresso ---------- */
function ring(pct, centerHTML){
  const R = 52, C = 2*Math.PI*R;
  const off = C * (1 - Math.min(100,Math.max(0,pct))/100);
  return `<div class="ring">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle class="track" cx="60" cy="60" r="${R}" stroke-width="9" fill="none"/>
      <circle class="fill" cx="60" cy="60" r="${R}" stroke-width="9" fill="none"
        stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="center">${centerHTML}</div>
  </div>`;
}

function pageHome(main){
  const r = currentRank();

    <div class="card" style="grid-column:1/-1">

<script>
/* ==========================================================
   10. EVOLUÇÃO — árvore visual de desbloqueios
   ========================================================== */
function pageEvo(main){
  // sequência: ranks intercalados com o que cada um libera
  const nodes = [];
  const featureByRank = {};
  CFG.features.forEach(f => {
    const rk = f.req.rank || rankAtWhich(f.req);
    (featureByRank[rk] = featureByRank[rk] || []).push(f);
  });
  const microByXp = CFG.microActionLevels.slice(1);

  CFG.ranks.forEach(r => {
    const doneR = meetsReq(r.req);
    const isCurrent = currentRank().level === r.level;
    nodes.push({ kind:'rank', level:r.level, tag:`RANK ${r.level}`, name:r.name, req:r.req, state: doneR ? (isCurrent?'current':'done') : (r.level===currentRank().level+1?'current':'locked'), desc:r.desc });
    (featureByRank[r.level]||[]).forEach(f=>{
      nodes.push({ kind:'feature', tag:'SISTEMA', name:f.name, req:f.req, state: isFeatureUnlocked(f.id)?'done':'locked', desc:f.desc });
    });
    microByXp.forEach(l=>{
      if (l.req.rank === r.level){ /* reservado */ }
    });
  });
  // microações por duração como nós de capacidade
  CFG.microActionLevels.slice(1).forEach(l=>{
    nodes.push({ kind:'cap', tag:'CAPACIDADE', name:`Microação de ${l.minutes} min`, req:l.req, state: meetsReq(l.req)?'done':'locked', desc:'' });
  });
  // ordena capacidades junto pelo xp do requisito? mantém agrupado no fim das capacidades
  const featureNodes = nodes.filter(n=>n.kind!=='cap');
  const capNodes = nodes.filter(n=>n.kind==='cap');
  const ordered = featureNodes.concat([{kind:'sep'}], capNodes);

  const nodesHTML = ordered.map(n => {
    if (n.kind==='sep') return `<div style="text-align:center;color:var(--faint);font-size:10px;letter-spacing:2px;margin:20px 0">— CAPACIDADES —</div>`;
    const cls = n.state==='done'?'done':n.state==='current'?'current':'locked';
    const iconHTML = n.state==='done'?'✓':n.state==='current'?'◉':'🔒';
    const rankImg = n.kind==='rank' && state.images['rank'+n.level] ? `<img src="${state.images['rank'+n.level]}">` : null;
    return `<div class="tnode ${cls}">
      <span class="t-state">${rankImg || iconHTML}</span>
      <div class="t-tag">${esc(n.tag)}</div>
      <div class="t-name">${esc(n.name)}</div>
      ${n.desc?`<div class="t-req" style="color:var(--faint)">${esc(n.desc)}</div>`:''}
      ${n.state!=='done' && n.req ? `<div class="t-req">${reqText(n.req)}</div>`:''}
    </div>`;
  }).join('');

  main.innerHTML = `
  ${topbar()}
  <div class="card" style="margin-bottom:18px">
    <div class="label">Sua trajetória</div>
    <h3>Rank ${currentRank().level} — ${esc(currentRank().name)}</h3>
    <div class="sub">Você não recebe tudo de uma vez. Você desbloqueia a própria vida aos poucos — e cada nó aberto aqui foi conquistado, não dado.</div>
  </div>
  <div class="tree">${nodesHTML}</div>`;
}
function rankAtWhich(req){
  // encontra o menor rank que satisfaz o req (para reqs sem rank explícito)
  for (const r of CFG.ranks){
    const fake = { xp:r.req.xp, activeDays:r.req.activeDays, consistentDays:r.req.consistentDays||0 };
    if ((req.xp==null||fake.xp>=req.xp) && (req.activeDays==null||fake.activeDays>=req.activeDays)) return r.level;
  }
  return CFG.ranks.length;
}

   18. QUESTS
   ========================================================== */

    </div>
    <div class="card ${weeklyUnlocked?'':'locked-card'}">
      <div class="label">Quests semanais</div>
      ${weeklyUnlocked
        ? weeklyHTML
        : `<div style="text-align:center;padding:22px 8px">
             <div style="font-size:28px">🔒</div>
             <p class="sub" style="margin-top:10px">Desbloqueia no Rank 3.<br>Uma quest por vez — o jogo cresce com você.</p>
           </div>`}
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="label">Regras do jogo</div>
    <div class="sub" style="line-height:1.8">
      · XP nunca é removido. Ranks nunca caem. Nada se perde por inatividade.<br>
      · Voltar depois de dias parada rende <b>bônus de retorno</b>, não punição.<br>
      · Não há como "farmar": XP representa ações reais concluídas.<br>
      · Novas quests só aparecem quando você demonstra constância.
    </div>
  </div>`;
}

   HÁBITOS
   ========================================================== */
function pageHabitos(main){
  const tk = todayKey();
  const list = state.habits.map(h=>{
    const done = !!h.checks[tk];
    const total = Object.keys(h.checks).length;
    return `<div class="line-item">

function addHabit(){

  state.habits.push({ id:'h'+Date.now(), name, createdAt:todayKey(), checks:{} });
  logHistory(`Novo hábito: ${name}`);
  saveState(); renderMain();
}
function toggleHabit(id){
  const h = state.habits.find(x=>x.id===id); if(!h) return;

  if (h.checks[tk]){ delete h.checks[tk]; }

function deleteHabit(id){

}

function pageEstudos(main){
  const tk = todayKey();
  const todayMin = state.studies.filter(s=>s.date===tk).reduce((a,s)=>a+s.minutes,0);
  const xpToday = state.studies.filter(s=>s.date===tk).reduce((a,s)=>a+s.xp,0);
  const cap = CFG.xpRewards.studyDailyCap * (state.class==='academica'?2:1);
  const list = state.studies.slice(-10).reverse().map(s=>`
    <div class="line-item">
      <div class="li-body"><div class="li-title">${esc(s.subject)}</div>
      <div class="li-sub">${s.minutes} min · ${s.date}</div></div>
      <span class="badge">+${s.xp} XP</span>

  main.innerHTML = `
  ${topbar()}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card">
      <div class="label">Registrar sessão</div>
      <div class="field"><label>Assunto</label><input class="input" id="study-subject" placeholder="Ex.: Neurociência, inglês, concurso..."></div>

      <button class="btn btn-primary" onclick="addStudy()">Registrar sessão</button>
      <div class="sub" style="margin-top:12px">Hoje: ${todayMin} min · ${xpToday}/${cap} XP de estudos (teto diário anti-farm)</div>
    </div>

      <div class="label">Sessões recentes</div>
      ${list || '<div class="empty">Nenhuma sessão registrada ainda.</div>'}
    </div>
  </div>`;

function addStudy(){
  const subject = $('#study-subject').value.trim();
  const minutes = Math.max(1, Math.min(480, parseInt($('#study-minutes').value)||0));
  if (!subject){ toast('Qual foi o assunto?'); return; }
  const tk = todayKey();
  const cap = CFG.xpRewards.studyDailyCap * (state.class==='academica'?2:1);
  const xpToday = state.studies.filter(s=>s.date===tk).reduce((a,s)=>a+s.xp,0);
  const xp = Math.max(0, Math.min(minutes*CFG.xpRewards.studyPerMinute, cap - xpToday));
  state.studies.push({ id:'s'+Date.now(), subject, minutes, date:tk, xp });
  state.stats.studies++;
  registerActiveDay();
  if (xp>0) addXP(xp, `Estudo: ${subject}`, 'study'); else { toast('Teto diário de XP de estudos atingido — sessão registrada.'); saveState(); }
  renderMain();
}

function addFicha(){

  const exercises = lines.map(l=>{
    const p = l.split(',').map(x=>x.trim());
    return { name:p[0]||'Exercício', sets:p[1]||'3', reps:p[2]||'10', load:p[3]||'' };
  });
  state.workouts.fichas.push({ id:'f'+Date.now(), name, exercises });
  logHistory(`Nova ficha de treino: ${name}`);

function deleteFicha(id){
  state.workouts.fichas = state.workouts.fichas.filter(f=>f.id!==id);
  saveState(); renderMain();
}
function completeWorkout(fichaId){
  const f = state.workouts.fichas.find(x=>x.id===fichaId); if(!f) return;
  state.workouts.log.push({ fichaId, name:f.name, date:todayKey() });
  state.stats.workouts++;
  registerActiveDay();
  addXP(classBonus('workout', CFG.xpRewards.workoutDone), `Treino: ${f.name}`, 'workout');

}

        ${p.steps.map((s,i)=>`<div class="line-item" style="margin-bottom:6px;padding:9px 12px">
          <button class="check" style="width:22px;height:22px;font-size:11px;${s.done?'background:rgba(52,211,153,.2)':''}" onclick="toggleStep('${p.id}',${i})">${s.done?'✓':''}</button>

        ${!canMulti && activeCount>=1 ? `<div class="sub" style="margin-top:12px">🔒 Múltiplos projetos ativos desbloqueiam no Rank 5. Termine o atual primeiro — foco é a mecânica.</div>`:''}
      </div>

function addProject(){
  const name = $('#proj-name').value.trim(); if(!name) return;
  const canMulti = state.unlockedCapabilities.includes('multi_projects');
  const activeCount = state.projects.filter(p=>p.steps.some(s=>!s.done)).length;
  if (!canMulti && activeCount>=1){ toast('Um projeto ativo por vez (desbloqueia no Rank 5).'); return; }
  state.projects.push({ id:'p'+Date.now(), name, steps:[], createdAt:todayKey() });
  logHistory(`Novo projeto: ${name}`);
  saveState(); renderMain();
}
function deleteProject(id){ state.projects = state.projects.filter(p=>p.id!==id); saveState(); renderMain(); }
function addStep(id){
  const el = $('#step-'+id); const text = el.value.trim(); if(!text) return;
  state.projects.find(p=>p.id===id).steps.push({ text, done:false });
  saveState(); renderMain();
}
function toggleStep(id, i){
  const p = state.projects.find(p=>p.id===id); const s = p.steps[i];
  s.done = !s.done;
  if (s.done){ registerActiveDay(); addXP(classBonus('project', CFG.xpRewards.projectStep), `Passo de ${p.name}`, 'project'); }
  saveState(); renderMain();
}

<script>
/* ==========================================================
   13. ROTINA — grade semanal com timeline
   ========================================================== */
const ROUTINE_COLORS = {
  rotina:'linear-gradient(135deg,#2563eb,#3b82f6)',
  exercicio:'linear-gradient(135deg,#0891b2,#22d3ee)',
  estudo:'linear-gradient(135deg,#7c3aed,#8b5cf6)',
  lazer:'linear-gradient(135deg,#db2777,#ec4899)',
  trabalho:'linear-gradient(135deg,#1d4ed8,#60a5fa)',
  outro:'linear-gradient(135deg,#475569,#64748b)'
};
function pageRotina(main){
  const days = ['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];
  const hours = [];
  for (let h=5; h<=23; h++) hours.push(h);
  const todayIdx = (nowMinusRollover().getDay()+6)%7;

  let grid = `<div class="hcell"></div>` + days.map((d,i)=>`<div class="hcell ${i===todayIdx?'today':''}">${d}</div>`).join('');
  hours.forEach(h=>{
    grid += `<div class="tcell">${String(h).padStart(2,'0')}:00</div>`;
    for (let d=0; d<7; d++) grid += `<div class="cell" data-day="${d}" data-hour="${h}"></div>`;
  });

  // posiciona blocos
  setTimeout(()=>{
    state.routineBlocks.forEach(b=>{
      const [sh] = b.start.split(':').map(Number);
      const [eh] = b.end.split(':').map(Number);
      const cell = $(`.cell[data-day="${b.day}"][data-hour="${sh}"]`);
      if (!cell) return;
      const span = Math.max(1, eh - sh);
      const el = document.createElement('div');
      el.className = 'block';
      el.style.cssText = `top:1px;height:${span*34-4}px;background:${ROUTINE_COLORS[b.cat]||ROUTINE_COLORS.outro}`;
      el.textContent = b.title;
      el.title = `${b.title} · ${b.start}-${b.end} (clique para remover)`;
      el.onclick = ()=>{ removeRoutineBlock(b.id); };
      cell.appendChild(el);
    });
  }, 0);

  main.innerHTML = `
  ${topbar()}
  <div class="card" style="margin-bottom:16px">
    <div class="label">Adicionar bloco</div>
    <div class="row">
      <input class="input" id="rb-title" placeholder="Ex.: Academia" style="flex:2">
      <select class="input" id="rb-day">${days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select>
      <input class="input" id="rb-start" type="time" value="08:00">
      <input class="input" id="rb-end" type="time" value="09:00">
      <select class="input" id="rb-cat">
        <option value="rotina">Rotina</option><option value="exercicio">Exercício</option>
        <option value="estudo">Estudo</option><option value="trabalho">Trabalho</option>
        <option value="lazer">Lazer</option><option value="outro">Outro</option>
      </select>
      <button class="btn btn-primary" style="flex:0 0 auto" onclick="addRoutineBlock()">+</button>
    </div>
  </div>
  <div class="card">
    <div class="label">Sua semana</div>
    <div class="week-scroll"><div class="week">${grid}</div></div>
  </div>`;
}
function addRoutineBlock(){
  const title = $('#rb-title').value.trim(); if(!title){ toast('Dê um nome ao bloco.'); return; }
  state.routineBlocks.push({
    id:'r'+Date.now(), title,
    day: parseInt($('#rb-day').value),
    start: $('#rb-start').value, end: $('#rb-end').value,
    cat: $('#rb-cat').value
  });
  saveState(); renderMain();
}
function removeRoutineBlock(id){
  state.routineBlocks = state.routineBlocks.filter(b=>b.id!==id);
  saveState(); renderMain();
}

/* ==========================================================
   CALENDÁRIO — visão mensal da constância
   ========================================================== */
function pageCalendario(main){
  const ref = state._calRef ? keyToDate(state._calRef) : nowMinusRollover();
  const y = ref.getFullYear(), m = ref.getMonth();
  const first = new Date(y, m, 1);
  const startIdx = (first.getDay()+6)%7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthName = first.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  const tk = todayKey();

  let cells = ['S','T','Q','Q','S','S','D'].map(d=>`<div class="ch">${d}</div>`).join('');
  for (let i=0;i<startIdx;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const log = state.dayLog[k];
    const isToday = k===tk;
    const active = log?.active || (isToday && state.today.countedActive);
    const consistent = log?.consistent || (isToday && state.today.allThreeBonusGiven);
    const hasDiary = !!state.diary[k];
    cells += `<div class="cd ${active?'active-day':''} ${consistent?'consistent':''}" onclick="calDayInfo('${k}')">
      ${d}${hasDiary?'<span class="dd"></span>':''}${isToday?'<span style="position:absolute;top:4px;right:6px;font-size:8px;color:var(--cyan)">●</span>':''}
    </div>`;
  }

  main.innerHTML = `
  ${topbar()}
  <div class="card" style="max-width:640px;margin:0 auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="btn btn-soft btn-sm" onclick="calNav(-1)">←</button>
      <h3 style="text-transform:capitalize">${monthName}</h3>
      <button class="btn btn-soft btn-sm" onclick="calNav(1)">→</button>
    </div>
    <div class="cal">${cells}</div>
    <div class="sub" style="margin-top:14px;line-height:1.8">
      <span class="badge">azul</span> dia ativo &nbsp; <span class="badge green">verde</span> dia consistente &nbsp; <span style="color:var(--amber)">●</span> diário escrito
    </div>
    <div id="cal-info" style="margin-top:14px"></div>
  </div>`;
}
function calNav(dir){
  const ref = state._calRef ? keyToDate(state._calRef) : nowMinusRollover();
  ref.setMonth(ref.getMonth()+dir);
  state._calRef = `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-01`;
  renderMain();
}
function calDayInfo(k){
  const log = state.dayLog[k];
  const diary = state.diary[k];
  const el = $('#cal-info');
  el.innerHTML = `<div class="line-item" style="flex-direction:column;align-items:flex-start;gap:6px">
    <b>${keyToDate(k).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</b>
    <span class="sub">${log ? `${log.microsDone||0} microações · ${log.xp||0} XP ${log.consistent?'· dia consistente ✓':''}` : 'Sem registros neste dia.'}</span>
    ${diary?`<span class="sub" style="color:var(--text)">📓 “${esc(diary.slice(0,140))}${diary.length>140?'…':''}”</span>`:''}
  </div>`;
}

/* ==========================================================
   16. DIÁRIO
   ========================================================== */
function pageDiario(main){
  const tk = todayKey();
  const sel = state._diarySel || tk;
  const text = state.diary[sel] || '';
  main.innerHTML = `
  ${topbar()}
  <div class="grid" style="grid-template-columns:1fr 1.2fr;gap:16px" id="diary-grid">
    <div class="card">
      <div class="label">Selecione o dia</div>
      <input class="input" type="date" id="diary-date" value="${sel}" onchange="state._diarySel=this.value;renderMain()">
      <div class="sub" style="margin-top:12px">Dias escritos: <b>${Object.keys(state.diary).length}</b> · Escrever vale +${CFG.xpRewards.diaryEntry} XP (1x por dia).</div>
      <div class="sub" style="margin-top:10px;color:var(--faint)">Dica para dias difíceis: uma frase já conta. “Hoje foi pesado” é um registro válido.</div>
    </div>
    <div class="card">
      <div class="label">${sel===tk?'Escreva uma coisa sobre hoje':'Registro de '+keyToDate(sel).toLocaleDateString('pt-BR')}</div>
      <textarea class="input" id="diary-text" placeholder="O que aconteceu? O que você sentiu? Uma linha basta.">${esc(text)}</textarea>

  </div>
  <style>@media(max-width:900px){#diary-grid{grid-template-columns:1fr !important}}</style>`;

function saveDiary(k){

  const isNew = !state.diary[k] && t;

  if (isNew && k===todayKey()){
    state.stats.diary++;
    registerActiveDay();
    addXP(classBonus('diary', CFG.xpRewards.diaryEntry), 'Diário', 'diary');
  }
  saveState(); renderMain();

/* ==========================================================
   15. ALTER EGOS (mecânica simbólica e neutra)
   ========================================================== */
function egoPhrase(){
  const d = state.ego.discipline, i = state.ego.impulse;
  const total = d+i;
  if (!total) return 'O duelo começa com suas primeiras ações.';
  const pd = Math.round(d/total*100);
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  if (pd >= 60) return pick(CFG.egoPhrases.discipline);
  if (pd <= 40) return pick(CFG.egoPhrases.impulse);
  return pick(CFG.egoPhrases.balanced);
}
function egoImg(key, fallback){
  return `<div class="ego-img">${state.images[key]?`<img src="${state.images[key]}">`:fallback}</div>`;
}

/* ==========================================================

  const saldo = ins - outs;
  const byCat = {};
  state.finance.filter(t=>t.type==='out').forEach(t=>{ byCat[t.cat]=(byCat[t.cat]||0)+t.value; });
  const maxCat = Math.max(1, ...Object.values(byCat));
  const list = state.finance.slice(-12).reverse().map(t=>`
    <div class="line-item">
      <div class="li-body"><div class="li-title">${esc(t.desc)}</div>
      <div class="li-sub">${esc(t.cat)} · ${t.date}</div></div>
      <span class="badge ${t.type==='in'?'green':'pink'}">${t.type==='in'?'+':'−'} R$ ${t.value.toFixed(2).replace('.',',')}</span>
      <button class="btn btn-soft btn-sm" onclick="deleteTx('${t.id}')">✕</button>
    </div>`).join('');

  ${topbar()}

    <div class="card"><div class="label">Receitas</div><div class="big" style="color:var(--green);font-size:26px">R$ ${ins.toFixed(2).replace('.',',')}</div></div>
    <div class="card"><div class="label">Despesas</div><div class="big" style="color:var(--magenta);font-size:26px">R$ ${outs.toFixed(2).replace('.',',')}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:16px" id="fin-grid">
    <div class="card">
      <div class="label">Novo lançamento</div>
      <div class="field"><label>Descrição</label><input class="input" id="tx-desc" placeholder="Ex.: Mercado"></div>
      <div class="row">
        <div class="field"><label>Valor (R$)</label><input class="input" id="tx-value" type="number" min="0" step="0.01"></div>
        <div class="field"><label>Tipo</label><select class="input" id="tx-type"><option value="out">Despesa</option><option value="in">Receita</option></select></div>
      </div>
      <div class="field"><label>Categoria</label><input class="input" id="tx-cat" placeholder="Ex.: Casa, saúde, lazer" value="Outros"></div>
      <button class="btn btn-primary" onclick="addTx()">Lançar</button>
    </div>
    <div class="card">
      <div class="label">Despesas por categoria</div>
      ${Object.keys(byCat).length ? Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
        <div style="margin:10px 0">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
            <span>${esc(c)}</span><span style="color:var(--muted)">R$ ${v.toFixed(2).replace('.',',')}</span>
          </div>
          <div class="bar"><i style="width:${Math.round(v/maxCat*100)}%"></i></div>
        </div>`).join('') : '<div class="empty">Sem despesas registradas.</div>'}
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="label">Últimos lançamentos</div>

  <style>@media(max-width:900px){#fin-grid{grid-template-columns:1fr !important}}</style>`;
}
function addTx(){
  const desc = $('#tx-desc').value.trim();
  const value = parseFloat($('#tx-value').value);
  if (!desc || !(value>0)){ toast('Preencha descrição e valor.'); return; }
  state.finance.push({ id:'t'+Date.now(), desc, value, type:$('#tx-type').value, cat:$('#tx-cat').value.trim()||'Outros', date:todayKey() });
  registerActiveDay(); saveState(); renderMain();
}
function deleteTx(id){ state.finance = state.finance.filter(t=>t.id!==id); saveState(); renderMain(); }

/* ==========================================================
   CAIXA DE ENTRADA (captura rápida — anti-sobrecarga mental)
   ========================================================== */
function pageInbox(main){
  const open = state.inbox.filter(i=>!i.done);
  const list = open.map(i=>`
    <div class="line-item">
      <div class="li-body"><div class="li-title">${esc(i.text)}</div>
      <div class="li-sub">capturado em ${i.date}</div></div>
      <button class="btn btn-ghost btn-sm" onclick="resolveInbox('${i.id}')">Processado ✓</button>
    </div>`).join('');
  main.innerHTML = `
  ${topbar()}
  <div class="card" style="max-width:640px;margin:0 auto">
    <div class="label">Captura rápida</div>
    <div class="sub" style="margin-bottom:14px">Pensamento intruso? Ideia brilhante no meio de outra tarefa? Joga aqui em 5 segundos e volta ao foco. Processar é outro momento — não agora.</div>
    <div class="row">
      <input class="input" id="inbox-text" placeholder="Escreva e solte..." onkeydown="if(event.key==='Enter')addInbox()">

    <div style="margin-top:18px">${list || '<div class="empty">Caixa vazia. Cabeça leve. ✨</div>'}</div>

function addInbox(){
  const t = $('#inbox-text').value.trim(); if(!t) return;
  state.inbox.unshift({ id:'i'+Date.now(), text:t, date:todayKey(), done:false });
  saveState(); renderMain(); toast('Guardado. Pode voltar ao que estava fazendo.');
  setTimeout(()=>{ const el=$('#inbox-text'); if(el) el.focus(); }, 50);
}
function resolveInbox(id){
  const i = state.inbox.find(x=>x.id===id); if(i) i.done = true;
  saveState(); renderMain();
}

}

<script>

/* ==========================================================
   HOBBIES — lazer programado (ativação comportamental)
   ========================================================== */
function pageHobbies(main){
  const tk = todayKey();
  const wk = weekKey();
  const list = state.hobbies.map(h=>{
    const weekCount = Object.keys(h.log).filter(d=>d>=wk).length;
    const doneToday = !!h.log[tk];
    const last = Object.keys(h.log).sort().pop();
    const daysAgo = last ? diffDays(last, tk) : null;
    return `<div class="line-item">
      <div class="li-body">
        <div class="li-title">${esc(h.name)}</div>
        <div class="li-sub">
          ${weekCount}/${h.target}x esta semana
          ${daysAgo===null?'· ainda não registrado':daysAgo===0?'· hoje ✓':daysAgo>=5?`· faz ${daysAgo} dias — que tal hoje?`:`· última vez há ${daysAgo} dia(s)`}
        </div>
        <div class="bar" style="margin-top:7px"><i style="width:${Math.min(100,weekCount/h.target*100)}%"></i></div>
      </div>
      ${doneToday
        ? '<span class="badge green">hoje ✓</span>'
        : `<button class="btn btn-primary btn-sm" onclick="logHobby('${h.id}')">Fiz hoje</button>`}
      <button class="btn btn-soft btn-sm" onclick="deleteHobby('${h.id}')">✕</button>
    </div>`;
  }).join('');
  main.innerHTML = `
  ${topbar()}
  <div class="card" style="max-width:680px">
    <div class="label">Hobbies & lazer</div>
    <div class="sub" style="margin-bottom:16px">Prazer e descanso fazem parte do sistema — não são fuga. Agendar lazer de propósito reduz a culpa e previne o esgotamento.</div>
    ${list || '<div class="empty">Nenhum hobby ainda. Desenhar? Jogar? Tocar algo? Um já basta.</div>'}
    <div class="row" style="margin-top:14px">
      <input class="input" id="hobby-name" placeholder="Ex.: Desenhar" style="flex:2">
      <input class="input" id="hobby-target" type="number" min="1" max="7" value="2" title="Vezes por semana" style="max-width:90px">
      <button class="btn btn-primary" style="flex:0 0 auto" onclick="addHobby()">Adicionar</button>
    </div>
    <div class="sub" style="margin-top:8px;color:var(--faint)">O número é a meta semanal de vezes. Registrar vale +${CFG.xpRewards.hobbyDone} XP.</div>
  </div>`;
}
function addHobby(){
  const name = $('#hobby-name').value.trim(); if(!name) return;
  const target = Math.max(1, Math.min(7, parseInt($('#hobby-target').value)||2));
  state.hobbies.push({ id:'hb'+Date.now(), name, target, log:{} });
  logHistory(`Novo hobby: ${name}`);
  saveState(); renderMain();
}
function logHobby(id){
  const h = state.hobbies.find(x=>x.id===id); if(!h) return;
  const tk = todayKey();
  if (h.log[tk]) return;
  h.log[tk] = true;
  state.stats.hobbies++;
  registerActiveDay();
  addXP(CFG.xpRewards.hobbyDone, `Hobby: ${h.name}`, 'hobby');
  saveState(); renderMain();
}
function deleteHobby(id){ state.hobbies = state.hobbies.filter(h=>h.id!==id); saveState(); renderMain(); }

/* ==========================================================
   MÍDIA — livros, filmes, séries, animes
   ========================================================== */
const MEDIA_TYPES = ['livro','filme','série','anime'];
const MEDIA_STATUS = { quero:'Quero ver/ler', vendo:'Estou vendo', feito:'Concluído', parei:'Parei' };
function pageMidia(main){
  const filter = state._mediaFilter || 'todos';
  const watching = state.media.filter(m=>m.status==='vendo');
  const items = state.media.filter(m=>filter==='todos'||m.type===filter);

  const stars = m => `<span class="stars">${[1,2,3,4,5].map(i=>
    `<span class="${m.rating>=i?'on':''}" onclick="rateMedia('${m.id}',${i})">★</span>`).join('')}</span>`;

  const itemHTML = m => `<div class="line-item">
    <div class="li-body">
      <div class="li-title">${esc(m.title)}</div>
      <div class="li-sub"><span class="badge">${esc(m.type)}</span> ${stars(m)}</div>
      ${m.note?`<div class="li-sub" style="color:var(--text)">“${esc(m.note)}”</div>`:''}
    </div>
    <select class="input" style="width:auto;padding:6px 10px;font-size:11.5px" onchange="setMediaStatus('${m.id}',this.value)">
      ${Object.entries(MEDIA_STATUS).map(([k,v])=>`<option value="${k}" ${m.status===k?'selected':''}>${v}</option>`).join('')}

    <button class="btn btn-soft btn-sm" onclick="deleteMedia('${m.id}')">✕</button>
